 * @param {import('./types').CrashReason} reason причина падения
 */
function enterCrash(reason) {
  if (state.mode === 'crash') return;
  // колёса снимаем до смены режима — поза с вибрацией, как на кадре крэша
  const w = wheelsScreen();
  // с конструкции — сразу: угол дуги уходит в roll, чтобы поза не прыгнула
  if (state.ride) {
    state.roll += state.ride.ang;
    state.ride = null;
  }
  state.mode = 'crash';
  state.crash = {
    reason,
    t: 0,
    durationS: 1.4,
    r0: state.roll,
    r1: Math.ceil((state.roll + Math.PI) / TAU) * TAU,
    bx: 0,
    bh: state.h,
    bvx: rand(1.2, 1.9),
    bvh: rand(1.6, 2.4),
    brot: state.tilt,
    bvr: rand(7, 11),
    bkick: state.kick,
    bvk: rand(10, 16),
    snap: null,
  };
  state.trick = null;
  state.trickQ = null;
  state.spin = 0;
  state.kick = 0;
  state.kickDrop = 0;
  state.isOnRamp = false;
  state.jumps = 0;
  state.airTricks = [];
  state.airBonus = 0;
  state.autoSeq = [];
  state.autoDouble = 0;
  state.autoAfter = null;
  state.hV = Math.max(state.hV, 0) + 1.7;
  state.shake = 1.8;
  state.sqV -= 2;
  emit('crash', { reason, score: state.score, wheels: w });
}

// ---------------------------------------------------------------- ride
// Режим катания по конструкции (карта, этап 5, петля по gameplay-ux-plan §B):
// спека задаёт траекторию path(s) и интегрирует step(); двигатель только
// вешает позу на точку пути и ведёт камеру. Мир при этом прокручивается
// вслед за коровой — camX держит доску на экранном якоре.

/** @returns {number} секунды до конца текущей траектории ride */
function rideTimeLeft() {
  const ride = state.ride;
  if (!ride) return 0;
  const rs = FEATURE_TYPES[ride.feat.type].ride;
  return rs ? (rs.length(ride.feat) - ride.s) / Math.max(1, ride.v) : 0;
}

/** @param {import('./types').AnyFeature} feat конструкция с ride-спекой */
function enterRide(feat) {
  if (state.mode !== 'ground' || !FEATURE_TYPES[feat.type].ride) return;
  state.mode = 'ride';
  state.ride = { feat, s: 0, v: state.speed, ang: 0, isAutoDone: false };
  state.isOnRamp = false;
  state.tilt = 0;
  state.tiltV = 0;
  state.h = 0;
  state.hV = 0;
  state.jumps = 1;
  state.trick = null;
  state.trickQ = null;
  state.airTricks = [];
  state.airBonus = 0;
  emit('ride-enter', { type: feat.type });
}

/**
 * Сход с траектории: exit — угол дуги переходит в roll, скорость вдоль
 * траектории становится скоростью заезда; высокий выход — в воздух по
 * касательной. fail — срыв с конструкции.
 * @param {import('./types').RideState} ride
 * @param {import('./types').PathPoint} p точка пути на момент схода
 * @param {import('./types').RideStep} res результат последнего шага спеки
 */
function exitRide(ride, p, res) {
  const v = ride.v,
    feat = ride.feat;
  state.roll += ride.ang;
  state.ride = null;
  emit('ride-exit', { type: feat.type, result: res, ok: v > 0 });
  if (res === 'fail') {
    enterCrash('stall');
    return;
  }
  state.speed = clamp(Math.abs(v), MINSPD, MAXSPD);
  if (Math.abs(p.h) < 0.06) {
    if (v > 0) state.airBonus += 150; // прошёл конструкцию
    state.hV = 0;
    enterGround(0, 0);
  } else {
    state.hV = clamp(-v * Math.sin(p.angle), 0, 9);
    state.airT = 0;
    state.jumps = 1;
    state.airDurationS = timeToLand();
    enterAir('launch');
  }
}

/** Кадр катания по траектории: спека двигает s, поза — по path(s). */
function rideStep(dt) {
  const ride = /** @type {import('./types').RideState} */ (state.ride),
    rs = FEATURE_TYPES[ride.feat.type].ride;
  if (!rs) {
    exitRide(ride, { X: boardX(), h: 0, angle: 0 }, 'exit');
    return;
  }
  stepTrick(dt);
  // демо-автопилот делает один трюк на дуге — показывает, что можно
  if (!playerMode() && rs.tricks && !ride.isAutoDone && state.trick === null) {
    const left = rs.length(ride.feat);
    if (ride.s > left * 0.25 && ride.s < left * 0.75) {
      ride.isAutoDone = true;
      startTrick(pick(['spin', 'kick']), rideTimeLeft());
    }
  }
  const res = rs.step(ride.feat, ride, dt);
  const p = rs.path(ride.feat, ride.s);
  state.camX = p.X - (geometry.ox + 200 * geometry.s - geometry.vx);
  state.h = Math.max(0, p.h);
  ride.ang = p.angle;
  if (res !== 'ride') exitRide(ride, p, res);
}

/** @returns {boolean} получилось ли прыгнуть/сделать двойной */
function jump() {
  if (!ready() || state.mode === 'crash') return false;
  if (state.mode === 'ground') {
    state.hV = OLLIE_V + (state.isOnRamp ? state.slope * state.speed * 0.5 : 0);
    state.airT = 0;
    state.jumps = 1;
    state.isOnRamp = false;
    state.airTricks = [];
    state.airBonus = 0;
    state.tiltV -= 2.6;
    state.sqV += 1.4;
    state.earV -= 3.2;
    state.tagV += 3.5;
    enterAir('jump');
  } else if (state.mode === 'air' && state.jumps < 2) {
    state.jumps = 2;
    state.hV = Math.max(state.hV, 0) * 0.3 + DOUBLE_V;
    state.airTricks.push('double');
    emit('trick', { kind: 'double' });
    state.tiltV -= 1.8;
    state.earV -= 2.6;
    state.tagV += 3;
    state.sqV += 1;
    emit('airborne', { from: 'double' });
  } else return false;
  state.airDurationS = state.airT + timeToLand();
  return true;
}
/**
 * @param {import('./types').TrickKind} kind
 * @param {number} [tl] секунд до конца окна трюка (в воздухе — до земли)
 */
function startTrick(kind, tl = timeToLand()) {
  const T = TRICKS[kind];
  state.trick = {
    kind,
    t: 0,
    durationS: clamp(tl - 0.06, 0.28, T.durationS),
    dir: /** @type {1 | -1} */ (Math.random() < 0.5 ? 1 : -1),
  };
  state.earV -= 1.5;
  state.tagV += rand(-3, 3);
}
/** @param {import('./types').TrickKind} kind */
function trick(kind) {
  if (!ready() || state.mode === 'crash') return;
  // на конструкции трюки без прыжка — доска прижата к траектории
  if (state.mode === 'ride') {
    const rs = state.ride && FEATURE_TYPES[state.ride.feat.type].ride;
    if (!rs || !rs.tricks) return;
    if (state.trick) {
      state.trickQ = kind;
      return;
    }
    startTrick(kind, rideTimeLeft());
    return;
  }
  if (state.mode !== 'air' && !jump()) return;
  if (state.trick) {
    state.trickQ = kind;
    return;
  }
  startTrick(kind);
}
function finishTrick() {
  const tr = state.trick;
  if (!tr) return;
  state.spin = 0;
  state.roll = 0;
  state.kick = 0;
  state.kickDrop = 0;
  state.airTricks.push(tr.kind);
  if (state.mode === 'ride') state.airBonus += 100; // трюк на конструкции дороже
  emit('trick', { kind: tr.kind });
  state.trick = null;
  if (state.trickQ) {
    const q = state.trickQ;
    state.trickQ = null;
    const tl = state.mode === 'ride' ? rideTimeLeft() : timeToLand();
    if (tl > 0.3) startTrick(q, tl);
  }
}
function stepTrick(dt) {
  const tr = state.trick;
  if (!tr) return;
  tr.t += dt;
  const p = clamp(tr.t / tr.durationS, 0, 1),
    e = easeInOut(p);
  if (tr.kind === 'spin') state.spin = TAU * e * tr.dir;
  else if (tr.kind === 'flip') state.roll = -TAU * e;
  else {
    state.kick = TAU * e;
    state.kickDrop = Math.sin(Math.PI * p) * 46;
  }
  if (p >= 1) finishTrick();
}
/** слетели с конструкции — вылет в воздух */
function launch() {
  state.airT = 0;
  state.jumps = 1;
  state.hV = Math.min(3.9, 2.2 + 1.25 * state.spdN);
  state.airTricks = [];
  state.airBonus = 40;
  state.airDurationS = timeToLand();
  state.tiltV -= 1.2;
  state.earV -= 3;
  state.tagV += 3;
  state.shake = Math.min(1.8, state.shake + 0.45);
  enterAir('launch');
  if (!playerMode()) {
    const seqs = /** @type {import('./types').TrickKind[][]} */ (
      state.airDurationS > 0.95
        ? [
            ['spin', 'kick'],
            ['flip', 'kick'],
            ['kick', 'spin'],
            ['flip'],
            ['spin', 'flip'],
          ]
        : [['flip'], ['spin'], ['kick']]
    );
    state.autoSeq = pick(seqs).slice();
  }
}
/** @param {number} g высота земли под доской (росты коровы) */
function land(g) {
  if (state.trick) {
    if (state.trick.t / state.trick.durationS > 0.8) finishTrick();
    else {
      state.h = g;
      enterCrash('bail');
      return;
    }
  }
  state.trickQ = null;
  const impact = -state.hV;
  state.hV = 0;
  state.jumps = 0;
  state.airT = 0;
  state.sqV -= impact * 1.3;
  state.bobV += impact * 0.1;
  state.tiltV += 0.5;
  state.shake = Math.min(1.8, state.shake + 0.5 + 0.22 * impact);
  state.earV -= 3.4;
  state.tagV += (Math.random() < 0.5 ? -1 : 1) * 4.5;
  enterGround(g, impact);
}

// ---------------------------------------------------------------- crash
/** @param {number} dt шаг, секунды */
function crashStep(dt) {
  const c = state.crash;
  c.t += dt;
  // корова: подброс и кувырок вперёд
  state.hV -= GRAV * dt;
  state.h += state.hV * dt;
  if (state.h <= 0) {
    if (state.hV < -0.9) {
      state.hV = -state.hV * 0.32;
      state.sqV -= 1.4;
      state.shake = Math.min(1.8, state.shake + 0.3);
      const w = wheelsScreen();
      puff(w[1].x, w[1].y, w[1].z, 8, 1.2);
    } else state.hV = 0;
    state.h = 0;
  }
  const k = clamp(c.t / 0.95, 0, 1);
  state.roll = lerp(c.r0, c.r1, 1 - (1 - k) ** 3);
  // доска улетает вперёд, кувыркаясь, потом возвращается под копыта
  if (c.t < 0.95) {
    c.bvh -= GRAV * dt;
    c.bh += c.bvh * dt;
    if (c.bh <= 0) {
      c.bh = 0;
      c.bvh = Math.abs(c.bvh) > 0.8 ? -c.bvh * 0.38 : 0;
      c.bvr *= 0.5;
      c.bvk *= 0.5;
    }
    c.bx += c.bvx * dt;
    c.bvx *= Math.exp(-dt * 1.6);
    c.brot += c.bvr * dt;
    c.bkick += c.bvk * dt;
    c.snap = { bx: c.bx, bh: c.bh, brot: c.brot, bkick: c.bkick };
  } else {
    const u = smooth(clamp((c.t - 0.95) / 0.32, 0, 1)),
      s0 = c.snap || { bx: 0, bh: 0, brot: 0, bkick: 0 };
    c.bx = lerp(s0.bx, 0, u);
    c.bh = lerp(s0.bh, state.h, u);
    c.brot = lerp(s0.brot, Math.round(s0.brot / TAU) * TAU + state.tilt, u);
    c.bkick = lerp(s0.bkick, Math.round(s0.bkick / TAU) * TAU, u);
  }
  if (c.t >= c.durationS) {
    state.crash = null;
    state.roll = 0;
    state.invuln = 1.1;
    state.sqV -= 1;
    enterGround(0, 0);
  }
}

// ---------------------------------------------------------------- ground
/**
 * Опора под доской в режиме ground: конструкция несёт — едем по её
 * поверхности, съехали с края — вылет.
 * @param {import('./types').GroundInfo} gi поверхность под доской
 */
function stepGround(gi) {
  if (state.mode !== 'ground') return;
  if (gi.h > 0.001) {
    state.h = gi.h;
    state.isOnRamp = true;
    state.slope = gi.slope;
  } else if (state.isOnRamp) {
    state.isOnRamp = false;
    state.h = 0;
    launch();
  } else state.h = 0;
}

// ---------------------------------------------------------------- history
/** История поз для призраков (фиксированный шаг 1/60). @param {number} dt */
function stepHistory(dt) {
  state.histAcc += dt;
  while (state.histAcc >= 1 / 60) {
    state.histAcc -= 1 / 60;
    state.hist.unshift(curPose());
    if (state.hist.length > 14) state.hist.pop();
  }
}

// ---------------------------------------------------------------- autopilot
function autopilot() {
  if (playerMode() || state.mode === 'crash') return;
  if (state.mode === 'air') {
    if (state.autoDouble && state.airT >= state.autoDouble && state.jumps < 2) {
      state.autoDouble = 0;
      jump();
      if (state.autoAfter && !state.trick) {
        startTrick(state.autoAfter);
      }
      state.autoAfter = null;
    }
    if (
      !state.trick &&
      state.autoSeq.length &&
      state.airT > 0.05 &&
      timeToLand() > 0.36
    )
      startTrick(state.autoSeq.shift());
    return;
  }
  // ground: решения по конструкциям; ride/crash — вне зоны автопилота
  if (state.mode !== 'ground') return;
  const Xb = boardX(),
    V = state.speed * geometry.cowH;
  state.throttle = 0; // в демо газом владеет автопилот
  // ближайшая конструкция с подсказкой: спека знает свою актуальность
  /** @type {import('./types').AutopilotHint | null} */
  let hint = null;
  for (const f of feats) {
    const hnt = FEATURE_TYPES[f.type].autopilot?.(f);
    if (hnt) {
      hint = hnt;
      break;
    }
  }
  if (hint && hint.action !== 'none') {
    const t = (hint.at - Xb) / V;
    if (t <= hint.leadS && t > -0.05) {
      if (hint.action === 'double') {
        jump();
        state.autoDouble = 0.25;
        if (Math.random() < 0.5) state.autoAfter = pick(['spin', 'kick']);
      } else if (hint.action === 'jump') {
        jump();
        if (Math.random() < 0.5) startTrick(pick(['kick', 'spin']));
      } else state.throttle = 1; // hold — зажать разгон
      return;
    }
  }
  const room = !hint || (hint.at - Xb) / V > 1.6;
  if (room && state.t > state.nextFlourish) {
    state.nextFlourish = state.t + rand(3, 5.5);
    const r = Math.random();
    if (r < 0.28) {
      jump();
      startTrick('kick');
    } else if (r < 0.54) {
      jump();
      startTrick('spin');
    } else if (r < 0.86) {
      jump();
      state.autoDouble = 0.24;
      state.autoAfter = 'flip';
    } else jump();
  }
}

/**
 * @param {number} dt шаг, секунды
 * @param {number} g высота земли под доской (росты коровы)
 */
function physicsStep(dt, g) {
  // подвеска
  state.bobV += (-760 * state.bob - 17 * state.bobV) * dt;
  state.bob += state.bobV * dt;
  // наклон: на земле — покачивание, на трамплине — по склону, в воздухе — нос вверх, потом выравнивание
  let tt;
  if (state.mode === 'crash') tt = 0;
  else if (state.mode === 'air') {
    const ph = state.airT / Math.max(0.3, state.airDurationS);
    tt =
      ph < 0.32
        ? -0.17
        : lerp(-0.17, 0.04, smooth(clamp((ph - 0.32) / 0.58, 0, 1)));
  } else if (state.isOnRamp) tt = -Math.atan(state.slope);
  else
    tt =
      0.007 * Math.sin(state.t * 1.7) +
      0.006 * nB(state.t * 0.8) +
      0.004 * state.boost * Math.sin(state.t * 5.3);
  const kT = state.mode === 'air' ? 190 : 300;
  state.tiltV += (-kT * (state.tilt - tt) - 13 * state.tiltV) * dt;
  state.tilt += state.tiltV * dt;
  // приседание
  state.sqV += (-420 * (state.sq - 1) - 15 * state.sqV) * dt;
  state.sq += state.sqV * dt;
  state.sq = clamp(state.sq, 0.84, 1.1);
  // ухо на ветру
  const flutter =
    (Math.sin(state.t * 14.3) * 0.5 +
      Math.sin(state.t * 31.7 + 1.1) * 0.22 +
      nD(state.t * 7) * 0.55) *
    0.03 *
    (0.55 + 0.45 * state.spdN) *
    (reduce ? 0.5 : 1);
  const earT =
    0.04 + 0.06 * state.boost + (state.mode === 'air' ? 0.08 : 0) + flutter;
  state.earV += (-150 * (state.ear - earT) - 7 * state.earV) * dt;
  state.ear = clamp(state.ear + state.earV * dt, -0.3, 0.34);
  // бирка-маятник, которую отдувает назад
  const wind =
    20 *
    state.spdN *
    state.spdN *
    (1 + 0.28 * Math.sin(state.t * 19.1) + 0.25 * nC(state.t * 6.3));
  state.tagV +=
    (-72 * Math.sin(state.tag) +
      wind * Math.cos(state.tag) * 0.9 -
      2.4 * state.tagV) *
    dt;
  state.tag = clamp(state.tag + state.tagV * dt, -1.2, 1.3);

  if (state.mode === 'crash') {
    crashStep(dt);
    return;
  }
  if (state.mode === 'ride') {
    rideStep(dt);
    return;
  }
  if (state.mode === 'air') {
    state.airT += dt;
    state.hV -= GRAV * dt;
    state.h += state.hV * dt;
    stepTrick(dt);
    if (state.h <= g && state.hV < 0) land(g);
  }
}

/**
 * @param {number} i колесо (0 — заднее, 1 — переднее)
 * @param {number} strength сила удара
 */
function bumpAt(i, strength) {
  if (!onFlat()) return;
  state.bobV -= 0.11 * strength;
  state.tiltV += (i === 1 ? -1.3 : 0.9) * strength;
  state.shake = Math.min(1.6, state.shake + 0.35 * strength);
  state.earV -= 1.5 * strength;
  state.tagV += rand(-2.5, 2.5) * strength;
  const w = wheelsScreen()[i];
  puff(w.x, w.y, w.z, 7, 1.1 * strength);
  if (Math.random() < 0.45) sparks(w.x, w.y, w.z, 4);
}

// ---- game/features.js
// ---------------------------------------------------------------- road features
// Движок не знает видов конструкций: всё видоспецифичное — в спеках
// FEATURE_TYPES (карта, этап 5, D3/D4). Здесь — оркестрация.
let featSeq = 0;
/**
 * Фабрика фич трассы: общая оболочка {id, type, x0, x1, data}. id
 * монотонный — для отладки и ключей.
 * @template {string} T
 * @template D
 * @param {T} type
 * @param {number} x0 мировой X левого края, px
 * @param {number} x1 мировой X правого края, px
 * @param {D} data параметры вида (в ростах коровы)
 * @returns {import('./types').TrackFeature<T, D>}
 */
function createFeature(type, x0, x1, data) {
  return { id: ++featSeq, type, x0, x1, data };
}

// отладочный спавн: ?feat=<type> ставит эту конструкцию первой
const FEAT0 = new URLSearchParams(location.search).get('feat');
let feat0pending = !!(FEAT0 && FEATURE_TYPES[FEAT0]);

// выбор вида по весам таблицы FEATURE_TYPES
const SPECS = Object.values(FEATURE_TYPES);
const TOTAL_W = SPECS.reduce((a, s) => a + s.weight, 0);
const FALLBACK = FEATURE_TYPES.ob;
function pickSpec() {
  let r = Math.random() * TOTAL_W;
  for (const s of SPECS) {
    r -= s.weight;
    if (r <= 0) return s;
  }
  return FALLBACK;
}
/** x0 последней спец-конструкции (для рейт-лимита). */
function lastSpecialX() {
  const horizon = state.nextSpawnX - SPECIAL_EVERY_COWH * geometry.cowH;
  for (let i = feats.length - 1; i >= 0; i--) {
    const f = feats[i];
    if (FEATURE_TYPES[f.type].special) return f.x0;
    if (f.x1 < horizon) break; // дальше только старые
  }
  return -Infinity;
}
/** Подписки модели трассы (вызывается из main при старте). */
function initFeatures() {
  // чистая зона после приземления — ближние CLEAR_AFTER_LAND_COWH без конструкций
  on('land', () => {
    state.clearSpawnX = boardX() + CLEAR_AFTER_LAND_COWH * geometry.cowH;
  });
}

function spawnFeatures() {
  // на узких экранах спавним глубже — за видимым краем дороги, чтобы препятствия подъезжали издалека
  const ahead =
    state.camX +
    Math.max(
      W * 1.5 - geometry.vx,
      geometry.zEdge * 1.15 * (W - geometry.vx) + 2 * geometry.cowH,
    );
  while (state.nextSpawnX < ahead) {
    if (state.nextSpawnX < state.clearSpawnX)
      state.nextSpawnX = state.clearSpawnX;
    // форс-спавн через ?feat= обходит веса и рейт-лимиты
    const forced = feat0pending
      ? FEATURE_TYPES[/** @type {string} */ (FEAT0)]
      : null;
    feat0pending = false;
    let spec = forced || pickSpec();
    const prevX1 = feats.length ? feats[feats.length - 1].x1 : -Infinity;
    let X = Math.max(
      state.nextSpawnX,
      prevX1 + spec.minGapBeforeCowH * geometry.cowH,
    );
    // не больше одной спец-конструкции на SPECIAL_EVERY_COWH ростов
    if (
      !forced &&
      spec.special &&
      X - lastSpecialX() < SPECIAL_EVERY_COWH * geometry.cowH
    ) {
      spec = FALLBACK;
      X = Math.max(
        state.nextSpawnX,
        prevX1 + spec.minGapBeforeCowH * geometry.cowH,
      );
    }
    const plan = spec.plan({ X, cowH: geometry.cowH, spdN: state.spdN, rand });
    const f = createFeature(
      spec.type,
      X,
      X + plan.lengthCowH * geometry.cowH,
      plan.data,
    );
    // реестр стирает вид: на границе спавна приводим к известному объединению
    feats.push(
      /** @type {import('./types').AnyFeature} */ (/** @type {unknown} */ (f)),
    );
    state.nextSpawnX = f.x1 + plan.gapAfterCowH * geometry.cowH;
  }
  for (let i = feats.length - 1; i >= 0; i--) {
    const f = feats[i];
    if (geometry.vx + (f.x1 - state.camX) < -W * 0.5) feats.splice(i, 1);
  }
}
/**
 * @param {number} X мировой X
 * @returns {import('./types').GroundInfo} высота и наклон поверхности
 */
function groundInfo(X) {
  for (const f of feats) {
    const gi = FEATURE_TYPES[f.type].ground?.(f, X);
    if (gi) return gi;
  }
  return { h: 0, slope: 0 };
}
/**
 * Вход в ride-режим: конструкция сама решает через ride.canEnter(feat, state).
 * Вызывается после stepGround — доска на поверхности, режим актуален.
 */
function checkRideEntry() {
  if (state.mode !== 'ground') return;
  for (const f of feats) {
    const rs = FEATURE_TYPES[f.type].ride;
    if (rs && rs.canEnter(f, state)) {
      enterRide(f);
      return;
    }
  }
}
function checkObstacles() {
  const Xb = boardX();
  for (const f of feats)
    if (FEATURE_TYPES[f.type].collide?.(f, Xb, state.h) === 'hit')
      enterCrash('hit');
}
/** Швы на асфальте → удары по колёсам. */
function stepCracks() {
  const zB = geometry.zBottom,
    farX = state.camX + (W * 1.3 - geometry.vx) * geometry.zEdge;
  let last = cracks.length
    ? cracks[cracks.length - 1].X
    : state.camX + W * 0.6 * zB;
  while (last < farX) {
    last += rand(5, 13) * geometry.cowH;
    cracks.push({
      X: last,
      isHit: /** @type {[boolean, boolean]} */ ([false, false]),
    });
  }
  while (cracks.length && xAt(cracks[0].X, geometry.zEdge) < -W * 0.3)
    cracks.shift();
  const restM = poseMatrix({ y: state.bob, tilt: state.tilt, sq: state.sq });
  for (let i = 0; i < 2; i++) {
    const p = restM.transformPoint(
      new DOMPoint(META.contact[i][0], META.contact[i][1]),
    );
    const Xw = state.camX + (p.x - geometry.vx) * zAt(p.y);
    for (const c of cracks)
      if (!c.isHit[i] && Xw >= c.X) {
        c.isHit[i] = true;
        bumpAt(i, rand(0.6, 1));
      }
  }
}
/** Сбитые препятствия летят и отскакивают. @param {number} dt */
function stepFlying(dt) {
  for (const f of feats) FEATURE_TYPES[f.type].step?.(f, dt);
}

function drawFeatures() {
  const blur = (state.speed * geometry.cowH) / 45;
  /** @type {{z: number, f: import('./types').AnyFeature}[]} */
  const items = []; // дальние рисуем первыми
  for (const f of feats) {
    const spec = FEATURE_TYPES[f.type];
    if (!spec.draw || !spec.depth) continue;
    items.push({ z: spec.depth(f), f });
  }
  items.sort((a, b) => b.z - a.z);
  for (const it of items) FEATURE_TYPES[it.f.type].draw?.(it.f, blur);
  ctx.globalAlpha = 1;
}
function drawFlying() {
  for (const f of feats) FEATURE_TYPES[f.type].drawFlying?.(f);
}

// маркер над приближающейся конструкцией — виден, пока спрайт ещё мелкий;
// «×2» — длинные/высокие, где нужен двойной прыжок; краснеет к моменту прыжка
function drawMarkers() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const V = Math.max(1, state.speed * geometry.cowH),
    Xb = boardX();
  for (const f of feats) {
    const mk = FEATURE_TYPES[f.type].marker?.(f);
    if (!mk) continue;
    const mid = (f.x0 + f.x1) / 2,
      t = (mid - Xb) / V;
    if (t <= 0 || t > 2.6) continue;
    const z = obZ(mid - state.camX);
    const p = CAM.transformPoint(
      new DOMPoint(
        geometry.vx + (mid - state.camX) / z,
        yAt(z) - (mk.heightCowH * geometry.cowH) / z,
      ),
    );
    if (p.x < -24 * DPR || p.x > W + 24 * DPR) continue;
    const urgent = t < mk.leadS + 0.35;
    const a = smooth(clamp((2.6 - t) / 0.9, 0, 1));
    const s = (urgent ? 15 : 12) * DPR;
    const bob = (0.5 + 0.5 * Math.sin(state.t * (urgent ? 13 : 7))) * s * 0.35;
    ctx.globalAlpha = a;
    ctx.fillStyle = urgent ? '#ff5a4a' : '#ffd84a';
    ctx.beginPath();
    ctx.moveTo(p.x - s, p.y - bob - s * 1.9);
    ctx.lineTo(p.x + s, p.y - bob - s * 1.9);
    ctx.lineTo(p.x, p.y - bob);
    ctx.closePath();
    ctx.fill();
    // подпись — кэшированный спрайт, fillText каждый кадр не нужен
    const spr = textSprite(mk.label, s * 1.05, 'rgba(10,14,26,.92)');
    ctx.drawImage(
      spr,
      p.x - spr.width / 2,
      p.y - bob - s * 1.14 - spr.height / 2,
    );
  }
  ctx.globalAlpha = 1;
}

// значок у правого края: конструкция ещё за кадром, кольцо заполняется к моменту прыжка
function drawWarnings() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const V = state.speed * geometry.cowH,
    Xb = boardX(),
    r = Math.max(14 * DPR, 0.06 * geometry.cowH);
  for (const f of feats) {
    const mk = FEATURE_TYPES[f.type].marker?.(f);
    if (!mk) continue;
    const mid = (f.x0 + f.x1) / 2,
      t = (mid - Xb) / V,
      lead = mk.leadS;
    const z = obZ(mid - state.camX);
    const edge = CAM.transformPoint(
      new DOMPoint(geometry.vx + (f.x0 - state.camX) / z, yAt(z)),
    );
    if (t > lead + 1.3 || t < 0) continue;
    const fadeIn = smooth(clamp((lead + 1.3 - t) / 0.35, 0, 1)); // появился заранее
    const fadeOut = smooth(clamp((t - lead + 0.2) / 0.14, 0, 1)); // гаснет сразу после момента прыжка
    const seen = smooth(clamp((edge.x - W * 0.68) / (W * 0.08), 0, 1)); // конструкция уже хорошо видна — значок не нужен
    const a = fadeIn * fadeOut * seen;
    if (a <= 0.01) continue;
    const x = W - r - 14 * DPR,
      y = CAM.transformPoint(
        new DOMPoint(0, geometry.refY - 0.16 * geometry.cowH),
      ).y;
    const prog = clamp(1 - (t - lead) / 1.3, 0, 1),
      now = t <= lead + 0.06;
    ctx.globalAlpha = a;
    ctx.fillStyle = now ? 'rgba(255,216,74,.9)' : 'rgba(10,14,26,.62)';
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.25)';
    ctx.lineWidth = Math.max(2, r * 0.14);
    ctx.beginPath();
    ctx.arc(x, y, r, 0, TAU);
    ctx.stroke();
    ctx.strokeStyle = '#ffd84a';
    ctx.beginPath();
    ctx.arc(x, y, r, -Math.PI / 2, -Math.PI / 2 + prog * TAU);
    ctx.stroke();
    if (mk.icon) {
      const spr = /** @type {HTMLCanvasElement} */ (mk.icon),
        k = (r * 1.25) / Math.max(spr.width, spr.height);
      ctx.drawImage(
        spr,
        x - (spr.width * k) / 2,
        y - (spr.height * k) / 2,
        spr.width * k,
        spr.height * k,
      );
    }
    if (mk.label !== '!') {
      const spr = textSprite(
        mk.label,
        r * 0.62,
        '#ffd84a',
        'rgba(8,10,22,.85)',
        r * 0.16,
      );
      ctx.drawImage(spr, x - r * 1.75 - spr.width / 2, y - spr.height / 2);
    }
  }
  ctx.globalAlpha = 1;
}

// ---- game/ui.js
// ---------------------------------------------------------------- score
/** Визуальный «бамп» счётчика очков при начислении. */
function bumpScore() {
  scoreEl.classList.remove('bump');
  void scoreEl.offsetWidth;
  scoreEl.classList.add('bump');
  setTimeout(() => scoreEl.classList.remove('bump'), 200);
}
const shown = { score: -1, best: -1, auto: null, cta: null, res: null };
/** Обновляет HUD по текущему стейту (вызывается каждый кадр из render). */
function hud() {
  if (state.score !== shown.score) {
    scoreEl.textContent = state.score.toLocaleString('ru-RU');
    shown.score = state.score;
  }
  if (state.best !== shown.best) {
    bestEl.textContent = state.best.toLocaleString('ru-RU');
    shown.best = state.best;
  }
  const auto = !playerMode();
  if (auto !== shown.auto) {
    autoEl.hidden = !auto;
    hudEl.classList.toggle('dim', auto);
    shown.auto = auto;
  }
  const cta = auto && !state.isTouched0; // призыв виден только в демо до первого касания
  if (cta !== shown.cta) {
    ctaEl.classList.toggle('dim', !cta);
    shown.cta = cta;
  }
  const res = state.t < state.resultUntil;
  if (res !== shown.res) {
    resultEl.classList.toggle('dim', !res);
    shown.res = res;
  }
}

// карточка результата поверх крэша — замыкает петлю «заехал → упал → увидел счёт»
/** @param {number} sc очки заезда */
function showResult(sc) {
  resultEl.innerHTML = `<b>Заезд: ${sc.toLocaleString('ru-RU')}</b><span>рекорд ${state.best.toLocaleString('ru-RU')}</span>`;
  resultEl.classList.remove('dim');
  state.resultUntil = state.t + 2.6;
}

// ---------------------------------------------------------------- coach (первый заезд)
/**
 * @param {string | null} text текст подсказки (null — скрыть)
 * @param {number} [durationS] секунды показа (по умолчанию — до замены)
 */
function setCoach(text, durationS) {
  if (!text) {
    coachEl.classList.add('dim');
    state.coachText = null;
    state.coachUntil = 0;
    return;
  }
  if (state.coachText !== text) {
    state.coachText = text;
    coachEl.textContent = text;
  }
  coachEl.classList.remove('dim');
  state.coachUntil = durationS ? state.t + durationS : Infinity;
}
// Тикер-тренер сокращён до гашения по таймеру: пошаговое обучение
// первого заезда — на пауза-гейтах (tutorial.js), здесь остаются только
// короткие советы по событию (сейчас — после пустого крэша).
function coachStep() {
  if (state.coachText && (state.t > state.coachUntil || !playerMode()))
    setCoach(null);
}

// ---------------------------------------------------------------- подписки
// DOM-реакции на события модели (композиция — в main.js).
function initUi() {
  on('score', () => bumpScore());
  on('crash', (d) => {
    if (!playerMode()) return;
    showResult(d.score);
    setCoach(d.score < 60 ? 'СМОТРИ НА «!» И ПРЫГАЙ ЗАРАНЕЕ' : null, 3.2);
  });
}

// ---------------------------------------------------------------- input
let holdTimer = 0,
  holding = false;
function touched() {
  if (!playerMode()) {
    state.score = 0;
    state.playT0 = state.t;
  } // новый заезд — с мягкого разгона
  state.isTouched0 = true;
  state.lastInput = state.t;
  state.autoSeq = [];
  state.autoDouble = 0;
  state.autoAfter = null;
  hintEl.classList.add('dim');
}
/** @param {import('./types').Action} a действие кнопки/клавиши */
function act(a) {
  // пауза туториала: сцену не трогаем — резюм только кнопкой карточки,
  // чтобы текст успели прочитать, а не промахнуть тапом
  if (state.isPaused) return;
  touched();
  if (a === 'jump') jump();
  else trick(a);
}
cv.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (state.isPaused) return;
  act('jump');
  clearTimeout(holdTimer);
  holding = false;
  holdTimer = setTimeout(() => {
    holding = true;
    state.throttle = 1;
  }, 280);
});
const release = () => {
  clearTimeout(holdTimer);
  if (holding) {
    holding = false;
    state.throttle = 0;
  }
};
addEventListener('pointerup', release);
addEventListener('pointercancel', release);
addEventListener('blur', () => {
  release();
  state.throttle = 0;
});
const padBtns = /** @type {NodeListOf<HTMLElement>} */ (
  document.querySelectorAll('.pad [data-act]')
);
for (const b of padBtns) {
  b.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    act(/** @type {import('./types').Action} */ (b.dataset.act));
    b.classList.add('on');
    setTimeout(() => b.classList.remove('on'), 160);
  });
  b.addEventListener('click', (e) => {
    if (e.detail === 0)
      act(/** @type {import('./types').Action} */ (b.dataset.act));
  }); // Enter/пробел на кнопке
}
addEventListener('keydown', (e) => {
  const k = e.code;
  const t = /** @type {HTMLElement | null} */ (e.target);
  if (t && t.closest && t.closest('button') && (k === 'Space' || k === 'Enter'))
    return;
  if (state.isPaused) return;
  const keyAct = {
    Space: 'jump',
    ArrowUp: 'jump',
    KeyW: 'jump',
    KeyQ: 'spin',
    Digit1: 'spin',
    KeyE: 'flip',
    Digit2: 'flip',
    KeyR: 'kick',
    Digit3: 'kick',
  }[k];
  if (keyAct) {
    e.preventDefault();
    if (!e.repeat) act(keyAct);
  } else if (k === 'ArrowRight' || k === 'KeyD') {
    e.preventDefault();
    state.throttle = 1;
    touched();
  } else if (k === 'ArrowLeft' || k === 'KeyA') {
    e.preventDefault();
    state.throttle = -1;
    touched();
  }
});
addEventListener('keyup', (e) => {
  const k = e.code;
  if ((k === 'ArrowRight' || k === 'KeyD') && state.throttle > 0)
    state.throttle = 0;
  if ((k === 'ArrowLeft' || k === 'KeyA') && state.throttle < 0)
    state.throttle = 0;
});

// ---- game/render.js
function setT(m) {
  const c = CAM.multiply(m);
  ctx.setTransform(c.a, c.b, c.c, c.d, c.e, c.f);
}
function setCam() {
  ctx.setTransform(CAM.a, CAM.b, CAM.c, CAM.d, CAM.e, CAM.f);
}

function drawSky() {
  // рисуем только видимый кусок неба — верх картинки почти всегда за кадром
  const inv = CAM.inverse(),
    pad = 16 * DPR;
  const p0 = inv.transformPoint(new DOMPoint(0, 0));
  const p1 = inv.transformPoint(new DOMPoint(W, H));
  const sx = clamp(p0.x + W * 0.12 - pad, 0, skyCv.width);
  const sy = clamp(p0.y + geometry.skyOff - pad, 0, skyCv.height);
  const sw = clamp(p1.x - p0.x + pad * 2, 0, skyCv.width - sx);
  const sh = clamp(p1.y - p0.y + pad * 2, 0, skyCv.height - sy);
  if (sw > 1 && sh > 1)
    ctx.drawImage(
      skyCv,
      sx,
      sy,
      sw,
      sh,
      sx - W * 0.12,
      sy - geometry.skyOff,
      sw,
      sh,
    );
  for (const c of clouds) {
    const sc = c.scale * geometry.u * 1.05;
    const w = c.img.width * sc,
      h = c.img.height * sc;
    const LW = W * 1.24 + w + c.gap * W; // у каждого облака свой цикл — небо не пустеет
    const x = (((c.x % 1) + 1) % 1) * LW - w - W * 0.12;
    const y = geometry.horizon * c.yN - h * 0.6;
    if (
      x + w < -W * 0.15 ||
      x > W * 1.15 ||
      y + h < -0.8 * geometry.cowH ||
      y > H + 0.4 * geometry.cowH
    )
      continue;
    ctx.globalAlpha = c.alpha;
    ctx.drawImage(c.img, x, y, w, h);
  }
  ctx.globalAlpha = 1;
}

function ridge(color, par, amp0, amp1, freq, seedFn, offY) {
  ctx.fillStyle = color;
  ctx.beginPath();
  const x0 = X0(),
    x1 = X1(),
    step = Math.max(4, 8 * DPR);
  ctx.moveTo(x0, geometry.horizon + 3);
  for (let x = x0; x <= x1 + step; x += step) {
    const wx = (x + state.camX * par) / (geometry.cowH * freq);
    const hh = (amp0 + amp1 * (fbm(seedFn, wx) * 0.5 + 0.5)) * geometry.cowH;
    ctx.lineTo(x, geometry.horizon - hh + offY);
  }
  ctx.lineTo(x1 + step, geometry.horizon + 3);
  ctx.closePath();
  ctx.fill();
}

function drawGround() {
  const hz = geometry.horizon,
    K = geometry.K,
    x0 = X0(),
    x1 = X1(),
    yEnd = H * 1.2;
  const bMin = Math.max(1, Math.round(1.5 * DPR));
  const zFar = 18,
    yTex = hz + K / zFar;
  ctx.fillStyle = '#7e90ab';
  ctx.fillRect(x0, hz - 1, x1 - x0, yTex - hz + 2);
  if (!canPatternTransform) {
    const g = ctx.createLinearGradient(0, hz, 0, H);
    g.addColorStop(0, '#5b6c62');
    g.addColorStop((geometry.edgeY - hz) / (H - hz) - 0.001, '#3c4a3a');
    g.addColorStop((geometry.edgeY - hz) / (H - hz), '#3a4658');
    g.addColorStop(1, '#1b1e2b');
    ctx.fillStyle = g;
    ctx.fillRect(x0, yTex, x1 - x0, yEnd - yTex);
    return;
  }
  const uR = (((state.camX * geometry.kR) % RT.w) + RT.w) % RT.w;
  const uF = (((state.camX * geometry.kF) % FT.w) + FT.w) % FT.w;
  const bMax = Math.max(bMin, Math.round(22 * DPR));
  // полосы растут к низу: ошибка линейной аппроксимации проекции ≈ band²/(4(y−hz)) px
  // — держим её субпиксельной (≤0.3px), поэтому кадр рисует ~50 полос вместо сотен
  for (let y = Math.floor(yTex); y < yEnd; ) {
    const bnd = clamp(Math.round(Math.sqrt(1.2 * (y - hz))), bMin, bMax);
    const zA = K / (y - hz),
      zB = K / (y + bnd - hz),
      z = (zA + zB) * 0.5;
    const road = y + bnd * 0.5 >= geometry.edgeY;
    const k = road ? geometry.kR : geometry.kF,
      kv = road ? 110 : 34;
    const T = road ? RT : FT,
      pat = road ? roadPat : fieldPat,
      u0 = road ? uR : uF;
    const a = 1 / (k * z),
      vA = zA * kv,
      vB = zB * kv;
    const d = bnd / (vB - vA);
    PM.a = a;
    PM.b = 0;
    PM.c = 0;
    PM.d = d;
    PM.e = geometry.vx - u0 * a;
    PM.f = y - d * (vA % T.h);
    pat.setTransform(PM);
    ctx.fillStyle = pat;
    ctx.fillRect(x0, y, x1 - x0, bnd);
    y += bnd;
  }
}

function drawGroundOverlays() {
  const hz = geometry.horizon,
    x0 = X0(),
    x1 = X1(),
    w = x1 - x0,
    yEnd = H * 1.2;
  const fh = geometry.edgeY - hz;
  ctx.fillStyle = geometry.hg;
  ctx.fillRect(x0, hz - 1, w, fh + 2);
  ctx.fillStyle = geometry.rg;
  ctx.fillRect(x0, geometry.edgeY, w, yEnd - geometry.edgeY);
  const zE = geometry.zEdge;
  const yS0 = yAt(zE * 1.07),
    yS1 = geometry.edgeY;
  ctx.fillStyle = 'rgba(92,90,80,0.5)';
  ctx.fillRect(x0, yS0, w, yS1 - yS0);
  const yL = yAt(zE * 0.975),
    th = Math.max(1, (0.011 * geometry.cowH) / zE);
  ctx.fillStyle = 'rgba(214,220,228,0.32)';
  ctx.fillRect(x0, yL - th / 2, w, th);
}

function repeatAt(z, P, off, fn) {
  const k0 = Math.floor((state.camX + (X0() - geometry.vx) * z - off) / P) - 1;
  const k1 = Math.ceil((state.camX + (X1() - geometry.vx) * z - off) / P) + 1;
  for (let k = k0; k <= k1; k++) fn(k, xAt(k * P + off, z));
}

function drawDashes() {
  const z = 1.72,
    yC = yAt(z),
    hh = Math.max(1.5, (geometry.K * 0.05) / (z * z));
  const V = state.speed * geometry.cowH,
    blur = V / z / 40,
    L = (2.3 * geometry.cowH) / z;
  repeatAt(z, 6.2 * geometry.cowH, 0, (k, x) => {
    const xa = x - blur / 2,
      xb = x + L + blur / 2;
    if (xb < X0() || xa > X1()) return;
    const f = clamp(blur / (xb - xa), 0.001, 0.49);
    const g = ctx.createLinearGradient(xa, 0, xb, 0);
    g.addColorStop(0, 'rgba(218,222,228,0)');
    g.addColorStop(f, 'rgba(218,222,228,0.42)');
    g.addColorStop(1 - f, 'rgba(218,222,228,0.42)');
    g.addColorStop(1, 'rgba(218,222,228,0)');
    ctx.fillStyle = g;
    ctx.fillRect(xa, yC - hh / 2, xb - xa, hh);
  });
}

function drawPoles() {
  const z = geometry.zEdge * 2.05,
    yb = yAt(z);
  const V = state.speed * geometry.cowH,
    blur = V / z / 45;
  const h = (2.2 * geometry.cowH) / z,
    w = (0.05 * geometry.cowH) / z,
    P = 7.6 * geometry.cowH;
  const top = yb - h,
    sag = (0.1 * geometry.cowH) / z;
  ctx.strokeStyle = 'rgba(38,48,66,0.5)';
  ctx.lineWidth = Math.max(1, 0.8 * DPR);
  const xs = [];
  repeatAt(z, P, P * 0.37, (k, x) => xs.push(x));
  for (let j = 0; j < 2; j++) {
    const yy = top + h * (0.04 + j * 0.05);
    ctx.beginPath();
    for (let i = 0; i + 1 < xs.length; i++) {
      ctx.moveTo(xs[i], yy);
      ctx.quadraticCurveTo(
        (xs[i] + xs[i + 1]) / 2,
        yy + sag * 2,
        xs[i + 1],
        yy,
      );
    }
    ctx.stroke();
  }
  ctx.fillStyle = '#3f4b62';
  const al = clamp((w / (w + blur)) * 1.5, 0.25, 1);
  for (const x of xs) {
    ctx.globalAlpha = al;
    ctx.fillRect(x - (w + blur) / 2, top, w + blur, h);
    ctx.fillRect(
      x - (w * 3.2 + blur) / 2,
      top + h * 0.03,
      w * 3.2 + blur,
      Math.max(1, w * 0.5),
    );
  }
  ctx.globalAlpha = 1;
}

function drawPosts() {
  const z = geometry.zEdge * 0.985,
    yb = yAt(z);
  const V = state.speed * geometry.cowH,
    blur = V / z / 45;
  const h = (0.16 * geometry.cowH) / z,
    w = (0.02 * geometry.cowH) / z;
  const al = clamp((w / (w + blur)) * 1.6, 0.18, 0.85);
  repeatAt(z, 3.7 * geometry.cowH, 0.8 * geometry.cowH, (k, x) => {
    const xl = x - (w + blur) / 2,
      ww = w + blur;
    ctx.globalAlpha = al;
    ctx.fillStyle = '#e4e8ee';
    ctx.fillRect(xl, yb - h, ww, h);
    ctx.fillStyle = '#16181e';
    ctx.fillRect(xl, yb - h, ww, h * 0.26);
    ctx.fillStyle = '#ff9a3c';
    ctx.fillRect(xl, yb - h * 0.2, ww, h * 0.06);
  });
  ctx.globalAlpha = 1;
}

function drawShadow() {
  const g = state.mode === 'crash' ? 0 : groundInfo(boardX()).h;
  const m = poseMatrix({
    y: state.bob + vib() - g,
    tilt: onFeature() ? state.tilt : state.tilt * 0.5,
    sq: 1,
  });
  const a = m.transformPoint(new DOMPoint(80, 488)),
    b = m.transformPoint(new DOMPoint(318, 598));
  const cx = (a.x + b.x) / 2,
    cy = (a.y + b.y) / 2;
  const len = Math.hypot(b.x - a.x, b.y - a.y) * 0.62,
    wid = 0.05 * geometry.cowH;
  const k = 1 - clamp((state.h - g) / 0.5, 0, 0.7);
  const draw = (sx, sy, al) => {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(Math.atan2(b.y - a.y, b.x - a.x));
    ctx.scale(sx / 64, sy / 64);
    ctx.globalAlpha = al;
    ctx.drawImage(shadowImg, -64, -64);
    ctx.restore();
  };
  setCam();
  draw(len * 1.25 * k, wid * 2.4 * k, 0.32 * k);
  draw(len * k, wid * k, 0.7 * k);
}

function star(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + (i * Math.PI) / 5,
      rad = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
}

// полосы смаза
function drawStreaks(m, sp, busy) {
  if (!streaks.length || !streakCv) return;
  setT(m);
  const t = state.t,
    fade = busy ? 0.25 : 1;
  for (let i = 0; i < streaks.length; i++) {
    const s = streaks[i];
    const len =
      (60 + 150 * s.w * s.base) *
      (0.45 + 0.55 * sp) *
      (0.62 + 0.38 * Math.sin(t * s.f + s.ph));
    ctx.globalAlpha =
      clamp((0.1 + 0.2 * s.w) * (0.55 + 0.45 * sp), 0, 0.6) * fade;
    ctx.drawImage(
      streakCv,
      0,
      i * 4 + 1,
      128,
      2,
      s.x - len,
      s.y - 1.2,
      len,
      2.6,
    );
  }
}
// призраки
function drawGhosts(sp, busy) {
  const GN = 4,
    spacing = (0.05 + 0.035 * state.boost) * geometry.cowH * sp;
  for (let i = GN; i >= 1; i--) {
    const h = state.hist[Math.min(state.hist.length - 1, i * 2)];
    if (!h) continue;
    setT(poseMatrix({ ...h, x: -i * spacing }));
    ctx.globalAlpha =
      0.2 * (1 - i / (GN + 1)) * (0.55 + 0.45 * sp) * (busy ? 0.4 : 1);
    ctx.drawImage(ghostCv, META.base.x - GHOST_BLUR, META.base.y);
  }
}
// звёздочки над головой после падения
function drawCrashStars() {
  const c = state.crash;
  if (!c || c.t <= 0.3) return;
  setCam();
  const hm = poseMatrix({
    y: state.bob - state.h,
    tilt: state.tilt,
    sq: state.sq,
  });
  const hp = hm.transformPoint(new DOMPoint(430, 30));
  ctx.globalAlpha =
    clamp((c.durationS - c.t) / 0.3, 0, 1) * clamp((c.t - 0.3) / 0.15, 0, 1);
  ctx.fillStyle = '#ffd84a';
  ctx.strokeStyle = 'rgba(60,40,0,.7)';
  ctx.lineWidth = Math.max(1, 1.5 * geometry.u);
  ctx.lineJoin = 'round';
  for (let i = 0; i < 3; i++) {
    const an = state.t * 7 + (i * TAU) / 3;
    star(
      hp.x + Math.cos(an) * 0.13 * geometry.cowH,
      hp.y + Math.sin(an) * 0.035 * geometry.cowH,
      0.03 * geometry.cowH,
    );
  }
}
function drawCow() {
  const pose = curPose(),
    m = poseMatrix(pose);
  const sp = clamp(state.spdN, 0.5, 2);
  const busy =
    state.trick || state.mode === 'crash' || Math.abs(state.roll) > 0.01;
  drawStreaks(m, sp, busy);
  drawGhosts(sp, busy);
  ctx.globalAlpha = 1;
  // доска, потом корова поверх (копыта стоят на деке)
  setT(boardMatrix(m));
  ctx.drawImage(imgs.board, META.board.x, META.board.y);
  setT(m);
  ctx.drawImage(imgs.base, META.base.x, META.base.y);
  const ep = META.ear.pivot;
  setT(
    m
      .translate(ep[0], ep[1])
      .rotate(state.ear * DEG)
      .translate(-ep[0], -ep[1]),
  );
  ctx.drawImage(imgs.ear, META.ear.x, META.ear.y);
  const tp = META.tag.pivot;
  setT(
    m
      .translate(tp[0], tp[1])
      .rotate((state.tag - state.tilt) * DEG)
      .translate(-tp[0], -tp[1]),
  );
  ctx.drawImage(imgs.tag, META.tag.x, META.tag.y);
  drawCrashStars();
  ctx.globalAlpha = 1;
}

let grainFlip = 0;
function post() {
  // свечение: даунсэмпл → ^4 (оставляем светлое) → апсэмпл → screen
  bAg.globalCompositeOperation = 'copy';
  bAg.drawImage(cv, 0, 0, bA.width, bA.height);
  bBg.globalCompositeOperation = 'copy';
  bBg.drawImage(bA, 0, 0, bB.width, bB.height);
  bBg.globalCompositeOperation = 'multiply';
  bBg.drawImage(bA, 0, 0, bB.width, bB.height);
  bBg.drawImage(bB, 0, 0);
  if (bloomG) {
    // блум, виньетку и зерно докладывает композитор (слои #bloom, .vig, .grain)
    bloomG.globalCompositeOperation = 'copy';
    bloomG.drawImage(bB, 0, 0, bloomEl.width, bloomEl.height);
    if (grainEl && !reduce && (grainFlip = (grainFlip + 1) & 1) === 0) {
      grainEl.style.transform = `translate3d(${(Math.random() * 160) | 0}px, ${(Math.random() * 160) | 0}px, 0)`;
    }
    return;
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  bCg.globalCompositeOperation = 'copy';
  bCg.drawImage(bB, 0, 0, bC.width, bC.height);
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = 0.42;
  ctx.drawImage(bC, 0, 0, W, H);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.drawImage(vigCv, 0, 0);
  const pat = grainPats[((state.t * 24) | 0) % grainPats.length];
  if (pat && canPatternTransform) {
    PM.a = 1;
    PM.b = 0;
    PM.c = 0;
    PM.d = 1;
    PM.e = reduce ? 0 : (Math.random() * 160) | 0;
    PM.f = reduce ? 0 : (Math.random() * 160) | 0;
    pat.setTransform(PM);
    ctx.globalCompositeOperation = 'overlay';
    ctx.globalAlpha = 0.075;
    ctx.fillStyle = pat;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
  }
}

/** Рисует весь кадр и обновляет HUD. */
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  setCam();
  drawSky();
  ridge('#7085a9', 0.0008, 0.006, 0.055, 2.4, nA, 0);
  ridge('#4a5d80', 0.0018, 0.004, 0.03, 1.1, nE, 0.5 * DPR);
  ridge('#1c273d', 0.004, 0.008, 0.024, 0.18, nC, 1.5 * DPR);
  drawGround();
  drawGroundOverlays();
  drawPoles();
  drawCracks();
  drawDashes();
  drawPosts();
  drawFeatures();
  drawLines(false);
  drawShadow();
  drawCow();
  setCam();
  drawFlying();
  drawParticles();
  drawLines(true);
  drawMarkers();
  drawWarnings();
  drawPops();
  post();
  hud();
}

// ---- game/tutorial.js
// Туториал-гейты (gameplay-ux-plan §A): вместо бегущих подсказок игра
// встаёт на паузу — поверх замершей сцены карточка с объяснением и
// кнопками «Понял» (продолжить) и «Пропустить всё». Показанные гейты
// пишутся в localStorage и не всплывают снова — ни в этом заезде, ни в
// следующих сессиях.
//
// Пауза — state.isPaused: frame() в main.js пропускает update/render
// (canvas держит последний кадр), ввод глушится в ui.js. Условие гейта,
// пойманное в воздухе или на конструкции, ждёт в очереди — карточка
// открывается только на земле, чтобы застывший кадр выглядел естественно
// и обсуждаемая конструкция была видна с маркером.

const KEY = 'cow-skate-tut'; // localStorage: ids показанных гейтов
const GAP_S = 0.9; // передышка между карточками — не стробить две подряд

/** @type {HTMLElement | null} */
const tutorEl = /** @type {HTMLElement | null} */ (
  document.getElementById('tutor')
);
const tutorTitle = /** @type {HTMLElement | null} */ (
  document.getElementById('tutorTitle')
);
const tutorText = /** @type {HTMLElement | null} */ (
  document.getElementById('tutorText')
);
const tutorOk = /** @type {HTMLElement | null} */ (
  document.getElementById('tutorOk')
);
const tutorSkip = /** @type {HTMLElement | null} */ (
  document.getElementById('tutorSkip')
);

/**
 * @typedef {object} Gate
 * @property {string} id
 * @property {string} title
 * @property {string} text
 * @property {((Xb: number, V: number) => boolean) | null} when условие
 *   показа: мировой X доски и скорость px/с → true = поставить в очередь.
 *   null — гейт ставит внешнее событие (enqueue из подписки).
 */

/**
 * Впереди (ближе leadS секунд по ходу) конструкция, чья подсказка
 * автопилота требует одно из перечисленных действий.
 * @param {number} Xb мировой X доски
 * @param {number} V скорость, px/с
 * @param {string[]} actions допустимые action из AutopilotHint
 * @param {number} leadS порог, секунды до конструкции
 */
function featAhead(Xb, V, actions, leadS) {
  for (const f of feats) {
    const hnt = FEATURE_TYPES[f.type].autopilot?.(f);
    if (
      hnt &&
      hnt.at > Xb &&
      (hnt.at - Xb) / V < leadS &&
      actions.includes(hnt.action)
    )
      return true;
  }
  return false;
}

/** @type {Gate[]} */
const GATES = [
  {
    id: 'start',
    title: 'Корова на скейте',
    text: 'Корова едет сама — твоя работа прыгать и делать трюки. Тап по экрану или кнопка «Прыжок» внизу.',
    when: () => true, // первый кадр, когда за рулём игрок
  },
  {
    id: 'ob',
    title: 'Препятствие!',
    text: 'Смотри на «!» над ним — тапни заранее, чтобы перепрыгнуть. За взятое +50.',
    when: (Xb, V) => featAhead(Xb, V, ['jump', 'double'], 1.7),
  },
  {
    id: 'double',
    title: 'Двойной прыжок',
    text: 'В воздухе можно тапнуть ещё раз — так берутся высокие и длинные препятствия «×2».',
    when: null, // встаёт в очередь по событию land — сразу после первого прыжка
  },
  {
    id: 'ramp',
    title: 'Трамплин!',
    text: 'В большом вылете жми кнопки трюков внизу — серия трюков за один прыжок умножает очки.',
    when: (Xb, V) => featAhead(Xb, V, ['none'], 2.6),
  },
  {
    id: 'loop',
    title: 'Мёртвая петля!',
    text: 'Обычной скорости не хватит — зажми экран заранее и держи, чтобы разогнаться и проехать круг.',
    when: (Xb, V) => featAhead(Xb, V, ['hold'], 3.0),
  },
];
/** @type {Map<string, Gate>} */
const byId = new Map(GATES.map((g) => [g.id, g]));

/** @type {Set<string>} ids уже показанных гейтов */
const shown = new Set();
/** @type {Gate[]} сработавшие условия, ждут земли */
const queue = [];
/** @type {Gate | null} открытая сейчас карточка */
let active = null,
  cooldownUntil = 0;

/** @returns {boolean} все гейты показаны — обучение завершено */
const done = () => GATES.every((g) => shown.has(g.id));

function persist() {
  try {
    localStorage.setItem(KEY, JSON.stringify([...shown]));
  } catch (e) {
    /* хранилище недоступно — переучим в следующий заезд */
  }
}

/** @param {string} id поставить гейт в очередь, если новый и ещё не ждёт */
function enqueue(id) {
  const g = byId.get(id);
  if (g && !shown.has(id) && g !== active && !queue.includes(g)) queue.push(g);
}

/** @param {Gate} g открыть карточку и заморозить мир */
function openGate(g) {
  active = g;
  shown.add(g.id);
  persist();
  // тикер-тренер под карточкой не нужен
  coachEl.classList.add('dim');
  state.coachText = null;
  state.coachUntil = 0;
  tutorTitle.textContent = g.title;
  tutorText.textContent = g.text;
  tutorEl.classList.add('on');
  state.isPaused = true;
  tutorOk.focus(); // Space/Enter теперь кликают «Понял», а не прыгают
}

function closeGate() {
  active = null;
  tutorEl.classList.remove('on');
  state.isPaused = false;
  cooldownUntil = state.t + GAP_S;
  // фокус со скрытой кнопки убираем — иначе пробел «дожмёт» невидимую «Понял»
  if (
    document.activeElement === tutorOk ||
    document.activeElement === tutorSkip
  )
    /** @type {HTMLElement} */ (document.activeElement).blur();
}

function skipAll() {
  for (const g of GATES) shown.add(g.id);
  queue.length = 0;
  persist();
  closeGate();
}

/** Кадровый шаг очереди гейтов — зовётся из update() рядом с тренером. */
function tutorialStep() {
  if (!tutorEl || done() || !playerMode() || state.isPaused) return;
  const Xb = boardX(),
    V = Math.max(1, state.speed * geometry.cowH);
  for (const g of GATES) {
    if (!g.when || shown.has(g.id) || g === active || queue.includes(g))
      continue;
    if (g.when(Xb, V)) queue.push(g);
  }
  if (!queue.length || state.mode !== 'ground' || state.t < cooldownUntil)
    return;
  openGate(/** @type {Gate} */ (queue.shift()));
}

/** Подписки и кнопки карточки (композиция — в main.js). */
function initTutorial() {
  if (!tutorEl) return;
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || '[]');
    if (Array.isArray(saved)) for (const id of saved) shown.add(id);
  } catch (e) {
    /* хранилище недоступно — учим заново */
  }
  // ?tut=reset — переиграть обучение (ручная проверка)
  if (new URLSearchParams(location.search).get('tut') === 'reset') {
    shown.clear();
    persist();
  }
  tutorOk.addEventListener('click', closeGate);
  tutorSkip.addEventListener('click', skipAll);
  // Escape на открытом диалоге = «Понял»
  addEventListener('keydown', (e) => {
    if (e.code === 'Escape' && active) closeGate();
  });
  // двойной прыжок учим в момент первого настоящего приземления
  on('land', (d) => {
    if (d.impact > 0.4 && playerMode()) enqueue('double');
  });
}

// ---- game/main.js
// Подписки слоёв на события модели (карта, этап 3): порядок = порядок
// исполнения при emit — спавн-правила, эффекты, дальше счёт, потом DOM.
initFeatures();
initEffects();
initScore();
initUi();
initTutorial();

// layout() только считает геометрию; буферы пересобираем здесь.
function relayout() {
  layout();
  buildSizeDependent();
}

// update() — оркестрация: шаги в прежнем порядке, по одной
// ответственности (карта, этап 4). Владельцы шагов — доменные модули.

/** Скорость и продвижение мира: разгон, крейсер, глушение после падения. */
function stepSpeed(dt) {
  state.t += dt;
  // мягкий старт заезда: ~14 с до крейсерской — время заметить препятствие и среагировать
  const rampT = state.playT0
    ? smooth(clamp((state.t - state.playT0) / 14, 0, 1))
    : 1;
  const cruise = lerp(3.3, CRUISE, rampT);
  const target =
    state.mode === 'crash'
      ? 1.3
      : state.throttle > 0
        ? MAXSPD
        : state.throttle < 0
          ? MINSPD
          : reduce
            ? 3.2
            : cruise;
  state.speed +=
    (target - state.speed) *
    (1 -
      Math.exp(
        -dt * (state.mode === 'crash' ? 3 : state.throttle > 0 ? 1.3 : 0.9),
      ));
  state.boost = clamp((state.speed - CRUISE) / (MAXSPD - CRUISE), 0, 1);
  state.spdN = state.speed / CRUISE;
  state.camX += state.speed * geometry.cowH * dt;
  state.invuln = Math.max(0, state.invuln - dt);
}

/**
 * Физика с подшагами, потом столкновения, автопилот и подсказки.
 * @param {number} dt шаг кадра, секунды
 * @param {import('./types').GroundInfo} gi поверхность под доской
 */
function stepPhysics(dt, gi) {
  let rem = dt;
  while (rem > 1e-6) {
    const h = Math.min(rem, 1 / 240);
    physicsStep(h, gi.h);
    rem -= h;
  }
  checkObstacles();
  autopilot();
  coachStep();
  tutorialStep();
}

/** @param {number} dt шаг кадра, секунды */
function update(dt) {
  stepSpeed(dt);
  spawnFeatures();
  const gi = groundInfo(boardX());
  stepGround(gi);
  checkRideEntry();
  stepPhysics(dt, gi);
  stepHistory(dt);
  stepCracks();
  stepFlying(dt);
  stepDust(dt);
  stepParticles(dt);
  stepLines(dt);
  stepClouds(dt);
  if (state.t > 9) hintEl.classList.add('dim');
  stepCamera(dt);
}

// ---------------------------------------------------------------- boot
let last = 0,
  emaFrame = 16.7,
  emaWork = 8,
  perfCool = 0;
/** @param {number} now метка requestAnimationFrame, мс */
function frame(now) {
  let dt = last ? (now - last) / 1000 : 1 / 60;
  last = now;
  if (!(dt > 0)) dt = 1 / 60;
  // туториал-гейт: update/render пропускаем — canvas держит последний
  // кадр, state.t стоит → таймеры и спавн заморожены, а last=now выше
  // не даёт поймать «долгий кадр» на выходе из паузы
  if (state.isPaused) {
    requestAnimationFrame(frame);
    return;
  }
  const t0 = performance.now();
  update(Math.min(dt, 1 / 20));
  render();
  // динамическое разрешение: просадка кадров → снижаем DPR, есть запас → возвращаем чёткость
  emaWork += (performance.now() - t0 - emaWork) * 0.06;
  emaFrame += (Math.min(dt * 1000, 34) - emaFrame) * 0.06; // cap — не считаем паузы в фоне
  perfCool -= dt;
  if (state.t > 4 && perfCool <= 0) {
    if (emaFrame > 19 && perfScale > 0.55) {
      setPerfScale(Math.max(0.55, perfScale - 0.15));
      perfCool = 2.5;
      relayout();
    } else if (emaWork < 8 && emaFrame < 17.5 && perfScale < 1) {
      setPerfScale(Math.min(1, perfScale + 0.12));
      perfCool = 3;
      relayout();
    }
  }
  requestAnimationFrame(frame);
}

let resizeQueued = false;
addEventListener('resize', () => {
  if (resizeQueued) return;
  resizeQueued = true;
  requestAnimationFrame(() => {
    resizeQueued = false;
    relayout();
  });
});

// Unbounded подгреваем сразу, не дожидаясь первой надписи: иначе тренер
// и попапы в первые секунды рисуются фолбэком и мигают при подмене
const warmFont = () => {
  if (!document.fonts || !document.fonts.load) return;
  for (const w of [500, 700, 800]) document.fonts.load(`${w} 16px Unbounded`);
};
warmFont();
if (document.fonts) document.fonts.ready.then(warmFont);

Promise.all([
  loadImg(SRC.base),
  loadImg(SRC.board),
  loadImg(SRC.ear),
  loadImg(SRC.tag),
]).then(([base, board, ear, tag]) => {
  initAssets({ base, board, ear, tag });

  relayout();
  initShadow();
  if (grainEl && grainTiles.length) {
    grainEl.style.backgroundImage = `url("${grainTiles[0].toDataURL()}")`;
  }
  for (let i = 0; i < 26; i++) lines.push(newLine(true));
  for (let i = 0; i < 60; i++) update(1 / 60); // прогрев: пыль и история уже есть
  requestAnimationFrame(frame);
});
})();
