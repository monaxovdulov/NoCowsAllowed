<!doctype html>
<!-- Сгенерировано tools/build-standalone.py из backend/app/static — не править руками. -->
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Canvas-анимация: корова на скейтборде мчит по трассе — моушн-блюр, шлейф, пыль, искры и тряска камеры."
    />
    <title>Корова на скейте</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&display=swap"
    />
    <style>
      :root {
        --bg: #0b0e17;
        --ink: #eef2fb;
        --glass: rgba(10, 14, 26, 0.52);
        --line: rgba(255, 255, 255, 0.18);
        --gold: #ffd84a;
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        overflow: hidden;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        background: var(--bg);
      }
      /* Пост-эффекты DOM-слоями: блум/виньетку/зерно смешивает композитор,
     и canvas не тратит fullscreen-проходы с дорогими blend-режимами */
      #bloom,
      .vig,
      .grain {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #bloom {
        width: 100%;
        height: 100%;
        mix-blend-mode: screen;
        opacity: 0.42;
      }
      .vig {
        background:
          radial-gradient(
            circle 55vmax at 0 0,
            rgba(255, 246, 225, 0.1),
            rgba(255, 246, 225, 0) 70%
          ),
          linear-gradient(
            to bottom right,
            rgba(2, 3, 8, 0) 40%,
            rgba(2, 3, 8, 0.5) 100%
          ),
          radial-gradient(
            circle 62vmax at 47% 45%,
            rgba(0, 0, 0, 0) 28%,
            rgba(6, 8, 20, 0.26) 57%,
            rgba(3, 4, 12, 0.72) 100%
          );
      }
      .grain {
        inset: -170px;
        opacity: 0.075;
        mix-blend-mode: overlay;
        background-repeat: repeat;
        will-change: transform;
      }
      .ui {
        font-family: 'Unbounded', ui-rounded, 'Segoe UI', system-ui, sans-serif;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.55);
      }

      .hud {
        position: fixed;
        left: 16px;
        top: calc(14px + env(safe-area-inset-top, 0px));
        display: grid;
        gap: 4px;
        pointer-events: none;
        transition: opacity 0.6s ease;
      }
      .hud.dim {
        opacity: 0.55;
      }
      .score {
        font-weight: 800;
        font-size: 30px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        transform-origin: left center;
        transition:
          transform 0.18s ease,
          color 0.18s ease;
      }
      .score.bump {
        transform: scale(1.14);
        color: var(--gold);
      }
      .best {
        font-weight: 500;
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0.78;
      }
      .best b {
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }

      .auto {
        position: fixed;
        right: 16px;
        top: calc(16px + env(safe-area-inset-top, 0px));
        padding: 7px 11px 7px 24px;
        border-radius: 999px;
        background: var(--glass);
        border: 1px solid var(--line);
        font-weight: 700;
        font-size: 10px;
        line-height: 1;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        pointer-events: none;
        text-shadow: none;
      }
      .auto::before {
        content: '';
        position: absolute;
        left: 10px;
        top: 50%;
        width: 7px;
        height: 7px;
        margin-top: -3.5px;
        border-radius: 50%;
        background: #7dffa1;
        box-shadow: 0 0 8px #7dffa1;
        animation: blink 1.4s ease-in-out infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.3;
        }
      }

      .hint {
        position: fixed;
        left: 16px;
        right: 16px;
        margin: 0;
        text-align: center;
        pointer-events: none;
        bottom: calc(78px + env(safe-area-inset-bottom, 0px));
        font-weight: 500;
        font-size: 10px;
        line-height: 1.6;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0.85;
        transition: opacity 1.8s ease;
      }
      .hint.dim {
        opacity: 0;
      }

      /* большой призыв «тапни» поверх демо-режима и контекстный тренер */
      .cta,
      .coach,
      .result {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        display: grid;
        justify-items: center;
        gap: 7px;
        text-align: center;
        pointer-events: none;
        transition: opacity 0.45s ease;
        /* свой слой заранее — появление не ждёт промоушна на занятом кадре */
        will-change: opacity;
      }
      .cta {
        top: 30%;
      }
      .cta b {
        font-weight: 800;
        font-size: 24px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--gold);
      }
      /* пульс крутится только у видимых надписей — скрытая анимация
         всё равно держит композитор */
      .cta:not(.dim) b {
        animation: ctaPulse 1.15s ease-in-out infinite;
      }
      .cta span,
      .result span {
        font-weight: 500;
        font-size: 10px;
        line-height: 1.6;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0.82;
      }
      @keyframes ctaPulse {
        50% {
          transform: scale(1.08);
        }
      }
      .coach {
        bottom: calc(150px + env(safe-area-inset-bottom, 0px));
        padding: 9px 16px;
        border-radius: 999px;
        white-space: nowrap;
        background: rgba(255, 216, 74, 0.14);
        border: 1px solid rgba(255, 216, 74, 0.55);
        color: var(--gold);
        font-weight: 800;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .coach:not(.dim) {
        animation: ctaPulse 0.85s ease-in-out infinite;
      }
      .result {
        top: 26%;
      }
      .result b {
        font-weight: 800;
        font-size: 21px;
        letter-spacing: 0.04em;
      }
      .cta.dim,
      .coach.dim,
      .result.dim {
        opacity: 0;
      }

      /* карточка туториал-гейта: игра на паузе, читаем спокойно */
      .tutor {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        place-items: center;
        padding: 24px;
        margin: 0;
        background: rgba(5, 8, 15, 0.62);
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.18s ease,
          visibility 0s linear 0.18s;
      }
      .tutor.on {
        opacity: 1;
        visibility: visible;
        transition: opacity 0.18s ease;
      }
      .tutorCard {
        box-sizing: border-box;
        width: min(360px, 100%);
        padding: 20px 18px 16px;
        border-radius: 18px;
        background: rgba(10, 14, 26, 0.94);
        border: 1px solid var(--line);
        display: grid;
        gap: 12px;
        justify-items: center;
        text-align: center;
        transform: translateY(8px) scale(0.97);
        transition: transform 0.18s ease;
      }
      .tutor.on .tutorCard {
        transform: none;
      }
      .tutorCard b {
        font-weight: 800;
        font-size: 15px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--gold);
      }
      .tutorCard p {
        margin: 0;
        font-weight: 500;
        font-size: 12px;
        line-height: 1.65;
        letter-spacing: 0.04em;
        opacity: 0.92;
      }
      .tutorBtns {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 4px;
      }
      .tutorBtns button {
        appearance: none;
        -webkit-appearance: none;
        margin: 0;
        cursor: pointer;
        touch-action: manipulation;
        border-radius: 999px;
        border: 1px solid var(--line);
        padding: 11px 18px;
        color: var(--ink);
        background: rgba(24, 32, 56, 0.78);
        font:
          700 12px/1 'Unbounded',
          ui-rounded,
          'Segoe UI',
          system-ui,
          sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        transition:
          transform 0.12s ease,
          background 0.12s ease,
          border-color 0.12s ease;
      }
      .tutorBtns button:active {
        transform: scale(0.95);
      }
      .tutorBtns button:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }
      #tutorOk {
        background: rgba(255, 216, 74, 0.22);
        border-color: rgba(255, 216, 74, 0.6);
        color: var(--gold);
      }
      #tutorSkip {
        opacity: 0.72;
        font-size: 10px;
      }

      .pad {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        display: flex;
        gap: 8px;
      }
      .pad button {
        appearance: none;
        -webkit-appearance: none;
        margin: 0;
        cursor: pointer;
        touch-action: manipulation;
        display: grid;
        justify-items: center;
        gap: 5px;
        min-width: 88px;
        padding: 10px 14px 8px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: var(--glass);
        color: var(--ink);
        font:
          700 12px/1.1 'Unbounded',
          ui-rounded,
          'Segoe UI',
          system-ui,
          sans-serif;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition:
          transform 0.12s ease,
          background 0.12s ease,
          border-color 0.12s ease;
      }
      .pad button:hover {
        background: rgba(24, 32, 56, 0.62);
      }
      .pad button.on {
        transform: scale(0.94);
        background: rgba(255, 216, 74, 0.3);
        border-color: rgba(255, 216, 74, 0.7);
      }
      .pad button:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }
      .pad kbd {
        font-family: inherit;
        font-weight: 500;
        font-size: 9px;
        line-height: 1;
        letter-spacing: 0.1em;
        opacity: 0.55;
      }
      @media (pointer: coarse) {
        .pad kbd {
          display: none;
        }
        /* на тачах backdrop-filter пересчитывается каждый кадр поверх живого canvas — дорого */
        .pad button {
          backdrop-filter: none;
          -webkit-backdrop-filter: none;
          background: rgba(10, 14, 26, 0.78);
        }
      }
      @media (max-width: 520px) {
        .pad {
          left: 16px;
          right: 16px;
          transform: none;
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 6px;
        }
        .pad button {
          min-width: 0;
          padding: 13px 2px;
          font-size: 11px;
        }
        .hint {
          bottom: calc(70px + env(safe-area-inset-bottom, 0px));
        }
        .cta {
          top: 24%;
        }
        .cta b {
          font-size: 20px;
        }
        .coach {
          bottom: calc(140px + env(safe-area-inset-bottom, 0px));
          font-size: 12px;
        }
        .score {
          font-size: 26px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .auto::before {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas
      id="scene"
      role="img"
      aria-label="Корова на скейтборде несётся по трассе, прыгает через препятствия и делает трюки"
    ></canvas>
    <canvas id="bloom" aria-hidden="true"></canvas>
    <div class="vig" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <div class="hud ui" id="hud">
      <span class="score" id="score">0</span>
      <span class="best">рекорд <b id="best">0</b></span>
    </div>
    <div class="auto ui" id="auto">Демо</div>
    <p class="hint ui" id="hint">
      Зажми мышь или → — разгон · ← — тормоз · двойной прыжок — второй раз в
      воздухе
    </p>
    <div class="cta ui dim" id="cta">
      <b id="ctaMain">Пробел — прыжок</b>
      <span>перепрыгивай препятствия · трюки дают очки</span>
    </div>
    <div class="coach ui dim" id="coach"></div>
    <div class="result ui dim" id="result"></div>
    <div class="tutor ui" id="tutor" role="dialog" aria-modal="true">
      <div class="tutorCard">
        <b id="tutorTitle"></b>
        <p id="tutorText"></p>
        <div class="tutorBtns">
          <button type="button" id="tutorOk">Понял</button>
          <button type="button" id="tutorSkip">Пропустить всё</button>
        </div>
      </div>
    </div>
    <nav class="pad" aria-label="Трюки">
      <button type="button" data-act="jump">Прыжок<kbd>Пробел</kbd></button>
      <button type="button" data-act="spin">360<kbd>Q</kbd></button>
      <button type="button" data-act="flip">Сальто<kbd>E</kbd></button>
      <button type="button" data-act="kick">Кикфлип<kbd>R</kbd></button>
    </nav>

const pick = (arr) => arr[(Math.random() * arr.length) | 0];

const easeInOut = (t) =>

const easeOutBack = (t) =>
  1 + 2.70158 * (t - 1) ** 3 + 1.70158 * (t - 1) ** 2;

/**
 * @param {number} seed
 * @returns {() => number} mulberry32
 */
function rng(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t ^= t + Math.imul(t ^ (t >>> 7), 61 | t);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function mk(w, h) {

}
/**
 * @param {number} seed
 * @returns {(x: number) => number}

function noise1(seed) {
  const r = rng(seed),
    N = 512,
    v = new Float32Array(N);
  for (let i = 0; i < N; i++) v[i] = r() * 2 - 1;
  return (x) => {
    const xf = Math.floor(x),
      f = x - xf,
      i = ((xf % N) + N) % N,
      j = (i + 1) % N;
    return v[i] + (v[j] - v[i]) * f * f * (3 - 2 * f);
  };
}

  if (!window.createImageBitmap || !window.fetch) return plain();
  return fetch(src)
    .then((r) => r.blob())
    .then((b) => createImageBitmap(b))
    .catch(plain);
};
/**
 * @param {CanvasRenderingContext2D} g
 * @param {number} x
 * @param {number} y
 * @param {number} w
 * @param {number} h
 * @param {number} r
 */
function rr(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

// Только геометрия кадра и мировой масштаб (карта, этап 3): пересборку
// размеро-зависимых буферов вызывающий делает сам — buildSizeDependent()
// зовётся из main.js рядом с layout().
function layout() {
  const cssW = Math.max(1, innerWidth),
    cssH = Math.max(1, innerHeight);
  let dpr = Math.min(window.devicePixelRatio || 1, 2) * perfScale;
  const cap = 2.6e6;
  if (cssW * cssH * dpr * dpr > cap) dpr = Math.sqrt(cap / (cssW * cssH));
  DPR = Math.max(0.5, dpr);
  const oldCowH = geometry.cowH;
  W = Math.round(cssW * DPR);
  H = Math.round(cssH * DPR);
  cv.width = W;
  cv.height = H;

  // корова (в пикселях фото: макушка y=45, колёса y=591, ширина ~545)
  // на узких экранах корова меньше, левее и ниже — иначе она съедает всю дорогу впереди
  const narrow = W < H * 0.8;
  const s = Math.min((0.58 * H) / 546, ((narrow ? 0.4 : 0.86) * W) / 545);
  const cowH = 546 * s;
  const bottom = Math.min(
    H * (narrow ? 0.88 : 0.8),
    H * (narrow ? 0.64 : 0.54) + cowH * 0.5,
  );
  const top = bottom - cowH;
  const cx = W * (W > H * 1.25 ? 0.36 : narrow ? 0.27 : 0.44); // впереди коровы — место, чтобы видеть препятствия
  Object.assign(geometry, {
    s,
    cowH,
    u: cowH / 670,
    ox: cx - 312 * s,
    oy: top - 45 * s,
  });
  geometry.horizon = geometry.oy + 200 * s; // линия горизонта как на фото
  geometry.edgeY = geometry.oy + 329 * s; // дальний край дороги
  geometry.refY = geometry.oy + 537 * s; // линия контакта доски = глубина 1
  geometry.K = geometry.refY - geometry.horizon;
  geometry.vx = W * 0.5;
  geometry.zEdge = geometry.K / (geometry.edgeY - geometry.horizon);
  geometry.zBottom = geometry.K / (H * 1.2 - geometry.horizon);
  geometry.kR = 150 / cowH; // пикселей текстуры асфальта на мировую единицу
  geometry.kF = 60 / cowH; // … поля
  geometry.obD = geometry.ox + 200 * s - geometry.vx; // смещение доски от камеры — здесь z=1
  geometry.obL = W * 1.45; // шкала схода препятствий к горизонту (шире — входят в кадр крупнее)
  if (oldCowH) {
    // мир в пикселях — пересчитываем всё под новый масштаб
    const k = cowH / oldCowH;
    state.camX *= k;
    state.nextSpawnX *= k;
    for (const f of feats) {
      f.x0 *= k;
      f.x1 *= k;
    }
  }
  cracks.length = 0;
  if (!state.nextSpawnX)
    state.nextSpawnX = state.camX + (W * 1.05 - geometry.vx) + 4 * cowH;
}

/** @type {import('./types').TextureSize} */
const RT = { w: 2048, h: 256 };
/** @type {import('./types').TextureSize} */
const FT = { w: 2048, h: 256 };
/** @type {CanvasPattern} */
let roadPat;

/**
 * @param {number} w
 * @param {number} h
 * @param {Float32Array} R
 * @param {Float32Array} Gc
 * @param {Float32Array} B
 * @returns {HTMLCanvasElement}
 */
function toCanvas(w, h, R, Gc, B) {
  const c = mk(w, h),
    g = c.getContext('2d'),
    img = g.createImageData(w, h),
    d = img.data;
  for (let i = 0, j = 0; i < w * h; i++, j += 4) {
    d[j] = R[i];
    d[j + 1] = Gc[i];
    d[j + 2] = B[i];
    d[j + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  return c;
}
/**
 * @param {Float32Array} buf
 * @param {number} w
 * @param {number} h
 * @returns {Float32Array}
 */
function vblur(buf, w, h) {
  const out = new Float32Array(buf.length);
  for (let y = 0; y < h; y++) {
    const a = ((y - 1 + h) % h) * w,
      b = y * w,
      c = ((y + 1) % h) * w;
    for (let x = 0; x < w; x++)
      out[b + x] = buf[a + x] * 0.25 + buf[b + x] * 0.5 + buf[c + x] * 0.25;
  }
  return out;
}

// асфальт: горизонтальные «смазанные» полосы
/** @returns {HTMLCanvasElement} */
function makeRoadTex() {
  const { w, h } = RT,
    r = rng(11),
    L = new Float32Array(w * h);
  for (let y = 0; y < h; y++) {
    const off = (r() - 0.5) * 6;
    const row = y * w;
    for (let x = 0; x < w; x++) L[row + x] = off;
    for (let k = 0; k < 64; k++) {
      const x0 = (r() * w) | 0,
        len = (14 + r() * r() * 520) | 0,
        q = r();
      const amp =
        q < 0.06 ? 14 + r() * 20 : q < 0.14 ? -(7 + r() * 9) : (r() - 0.5) * 9;
      for (let i = 0; i < len; i++)
        L[row + ((x0 + i) % w)] += amp * Math.sin((Math.PI * i) / len);
    }
  }
  const Lb = vblur(L, w, h);
  const R = new Float32Array(w * h),
    Gc = new Float32Array(w * h),
    B = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) {
    const v = Lb[i];
    R[i] = 36 + v;
    Gc[i] = 40 + v;
    B[i] = 55 + v * 1.1;
  }
  return toCanvas(w, h, R, Gc, B);
}

// поле: трава, смазанная скоростью
/** @returns {HTMLCanvasElement} */
function makeFieldTex() {
  const { w, h } = FT,
    r = rng(23);
  const pal = [
    [63, 79, 59],
    [77, 94, 73],
    [46, 59, 45],
    [86, 97, 63],
    [104, 108, 70],
    [36, 46, 31],
    [57, 72, 50],
    [70, 84, 62],
  ];
  const R = new Float32Array(w * h),
    Gc = new Float32Array(w * h),
    B = new Float32Array(w * h);
  for (let y = 0; y < h; y++) {
    const base = r() < 0.07 ? [30, 38, 27] : pal[(r() * pal.length) | 0];
    const o = (r() - 0.5) * 9,
      row = y * w;
    for (let x = 0; x < w; x++) {
      R[row + x] = base[0] + o;
      Gc[row + x] = base[1] + o;
      B[row + x] = base[2] + o * 0.6;
    }
    for (let k = 0; k < 30; k++) {
      const c = pal[(r() * pal.length) | 0],
        x0 = (r() * w) | 0,
        len = (30 + r() * r() * 800) | 0;
      const al = 0.3 + r() * 0.6,
        q = r(),
        br = q < 0.08 ? 1.35 : q < 0.16 ? 0.62 : 1;
      for (let i = 0; i < len; i++) {
        const win = Math.sin((Math.PI * i) / len) * al,
          j = row + ((x0 + i) % w);
        R[j] += (c[0] * br - R[j]) * win;
        Gc[j] += (c[1] * br - Gc[j]) * win;
        B[j] += (c[2] * br - B[j]) * win;
      }
    }
  }
  return toCanvas(w, h, vblur(R, w, h), vblur(Gc, w, h), vblur(B, w, h));
}

// облака: кучевые из пуфов, плоское основание, голубоватая тень снизу
/**
 * @param {number} seed
 * @param {number} w
 * @param {number} h
 * @param {number} n
 * @param {boolean} [flat]
 * @returns {HTMLCanvasElement}
 */
function makeCloud(seed, w, h, n, flat) {
  const r = rng(seed),
    c = mk(w, h),
    g = c.getContext('2d');
  const base = h * (flat ? 0.7 : 0.86);
  const nb = flat ? 4 : 2 + ((r() * 2) | 0),
    bumps = [];
  for (let i = 0; i < nb; i++) {
    bumps.push({
      x: 0.24 + 0.52 * (nb === 1 ? 0.5 : i / (nb - 1)) + (r() - 0.5) * 0.12,
      s: 0.11 + r() * 0.07,
      a: flat ? 0.14 + r() * 0.08 : 0.34 + r() * 0.4,
    });
  }
  const cap = flat ? 0.34 : 0.8;
  const top = (u) => {
    let v = 0;
    for (const b of bumps)
      v += b.a * Math.exp(-((u - b.x) ** 2) / (2 * b.s * b.s));
    const ends =
      smooth(clamp((u - 0.06) / 0.14, 0, 1)) *
      smooth(clamp((0.94 - u) / 0.14, 0, 1));
    return Math.min(v, cap) * ends * h;
  };
  const puffs = [];
  for (let i = 0; i < n; i++) {
    const u = 0.08 + (0.84 * (i + r())) / n,
      t = top(u);
    if (t < h * 0.07) continue;
    const rad = Math.max(h * 0.06, t * (0.38 + 0.2 * r()));
    const y = base - rad * 0.5 - r() * Math.max(0, t - rad * 1.2);
    puffs.push([u * w, y, rad, 0.72]);
  }
  const m = Math.round(n * 1.2);
  for (let i = 0; i < m; i++) {
    const u = 0.07 + (0.86 * (i + r() * 0.9)) / m,
      t = top(u);
    if (t < h * 0.17) continue;
    const rad =
      h * (0.04 + 0.045 * r()) * (0.7 + 0.9 * Math.min(1, t / (h * 0.45)));
    puffs.push([u * w, base - t + rad * 0.9, rad, 1]);
  }
  puffs.sort((a, b) => b[1] - a[1]);
  for (const [x, y, rad, lit] of puffs) {
    const gr = g.createRadialGradient(
      x - rad * 0.3,
      y - rad * 0.38,
      rad * 0.05,
      x,
      y,
      rad,
    );
    const v = Math.round(234 + 21 * lit);
    gr.addColorStop(0, `rgba(${v},${v},255,1)`);
    gr.addColorStop(0.5, `rgba(${v - 8},${v - 4},255,0.92)`);
    gr.addColorStop(0.78, 'rgba(228,238,252,0.55)');
    gr.addColorStop(1, 'rgba(222,233,250,0)');
    g.fillStyle = gr;
    g.beginPath();
    g.arc(x, y, rad, 0, TAU);
    g.fill();
  }
  g.globalCompositeOperation = 'source-atop';
  const sh = g.createLinearGradient(0, base - h * 0.42, 0, base);
  sh.addColorStop(0, 'rgba(150,170,206,0)');
  sh.addColorStop(0.5, 'rgba(136,158,198,0.32)');
  sh.addColorStop(1, 'rgba(98,122,172,0.78)');
  g.fillStyle = sh;
  g.fillRect(0, 0, w, h);
  const small = mk(w / 4, h / 4);
  small.getContext('2d').drawImage(c, 0, 0, small.width, small.height);
  const out = mk(w, h),
    og = out.getContext('2d');
  og.imageSmoothingQuality = 'high';
  og.globalAlpha = 0.92;
  og.drawImage(small, 0, 0, w, h);
  og.globalAlpha = 0.38;
  og.drawImage(c, 0, 0);
  return out;
}

/**
 * @param {string} color

 */
function softDot(color, size = 64) {

  gr.addColorStop(1, color.replace(/[\d.]+\)$/, '0)'));
  g.fillStyle = gr;
  g.fillRect(0, 0, size, size);
  return c;
}

}

// ---------------------------------------------------------------- obstacle sprites (рисуются один раз)
const OBR = 520; // пикселей спрайта на рост коровы
/** @type {import('./types').ObstacleSprites} */
const obSprites = {};
/**
 * @param {number} w ширина в ростах коровы
 * @param {number} h высота в ростах коровы
 * @param {(g: CanvasRenderingContext2D, w: number, h: number) => void} draw
 * @returns {import('./types').ObstacleSprite}
 */
function sprite(w, h, draw) {
  const pad = 8;
  const c = /** @type {import('./types').ObstacleSprite} */ (
    mk(w * OBR + pad * 2, h * OBR + pad * 2)
  );
  const g = /** @type {CanvasRenderingContext2D} */ (c.getContext('2d'));
  g.translate(pad, pad);
  draw(g, w * OBR, h * OBR);
  c.pad = pad;
  return c;
}
/**
 * @param {CanvasRenderingContext2D} g
 * @param {number} w
 * @param {number} h
 */
function coneTo(g, w, h) {
  const cx = w / 2,
    baseH = h * 0.08,
    bodyB = h - baseH * 0.55,
    tw = w * 0.14,
    bw = w * 0.78;
  rr(g, 0, h - baseH, w, baseH, baseH * 0.3);
  g.fillStyle = '#1b1d22';
  g.fill();
  const body = () => {
    g.beginPath();
    g.moveTo(cx - tw / 2, h * 0.03);
    g.lineTo(cx + tw / 2, h * 0.03);
    g.lineTo(cx + bw / 2, bodyB);
    g.lineTo(cx - bw / 2, bodyB);
    g.closePath();
  };
  const lg = g.createLinearGradient(cx - bw / 2, 0, cx + bw / 2, 0);
  lg.addColorStop(0, '#ff9a4a');
  lg.addColorStop(0.35, '#ff7a1f');
  lg.addColorStop(0.72, '#e2560c');
  lg.addColorStop(1, '#a93d06');
  body();
  g.fillStyle = lg;
  g.fill();
  g.save();
  body();
  g.clip();
  const sg = g.createLinearGradient(cx - bw / 2, 0, cx + bw / 2, 0);
  sg.addColorStop(0, '#ffffff');
  sg.addColorStop(0.6, '#e9edf3');
  sg.addColorStop(1, '#aab1bc');
  g.fillStyle = sg;
  g.fillRect(0, h * 0.27, w, h * 0.11);
  g.fillRect(0, h * 0.53, w, h * 0.12);
  g.restore();
  g.fillStyle = '#c64a0a';
  g.fillRect(cx - tw / 2, h * 0.02, tw, h * 0.03);
}
// Таблица рисовальщиков препятствий — ключи 1:1 с OBS (карта, этап 5):
// новый вид препятствия = запись в OBS + запись здесь.
/** @type {Record<import('./types').ObstacleKind, (g: CanvasRenderingContext2D, w: number, h: number) => void>} */
const OB_PAINT = {
  cone: coneTo,
  cones: (g, w, h) => {
    const cw = OBS.cone.w * OBR;
    for (const f of [0, 0.5, 1]) {
      g.save();
      g.translate(f * (w - cw), 0);
      coneTo(g, cw, h);
      g.restore();
    }
  },
  hay: (g, w, h) => {
    const r = rng(71),
      fy = h * 0.2,
      fw = w * 0.93;
    g.beginPath();
    g.moveTo(w * 0.02, fy);
    g.lineTo(w * 0.09, 0);
    g.lineTo(w, 0);
    g.lineTo(fw, fy);
    g.closePath();
    g.fillStyle = '#e8c56c';
    g.fill();
    rr(g, 0, fy, fw, h - fy, h * 0.07);
    const lg = g.createLinearGradient(0, fy, 0, h);
    lg.addColorStop(0, '#d9ac45');
    lg.addColorStop(1, '#8f6a22');
    g.fillStyle = lg;
    g.fill();
    g.save();
    rr(g, 0, fy, fw, h - fy, h * 0.07);
    g.clip();
    const cols = [
      'rgba(246,219,130,.75)',
      'rgba(180,134,48,.7)',
      'rgba(232,196,98,.7)',
      'rgba(128,92,30,.6)',
    ];
    for (let i = 0; i < 520; i++) {
      const x = r() * fw,
        y = fy + r() * (h - fy),
        a = (r() - 0.5) * 0.9,
        l = 5 + r() * 14;
      g.strokeStyle = cols[(r() * cols.length) | 0];
      g.lineWidth = 1 + r() * 1.3;
      g.beginPath();
      g.moveTo(x, y);
      g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l);
      g.stroke();
    }
    g.restore();
    g.fillStyle = 'rgba(92,60,20,.85)';
    for (const f of [0.3, 0.7]) {
      g.fillRect(fw * f - 3, fy, 6, h - fy);
      g.beginPath();
      g.moveTo(fw * f - 3, fy);
      g.lineTo(fw * f + w * 0.07 - 3, 0);
      g.lineTo(fw * f + w * 0.07 + 3, 0);
      g.lineTo(fw * f + 3, fy);
      g.closePath();
      g.fill();
    }
  },
  tire: (g, w, h) => {
    const cx = w / 2,
      cy = h / 2,
      R = h / 2,
      r1 = R * 0.58;
    const rg = g.createRadialGradient(
      cx - R * 0.3,
      cy - R * 0.3,
      R * 0.2,
      cx,
      cy,
      R,
    );
    rg.addColorStop(0, '#3a3c42');
    rg.addColorStop(1, '#141518');
    g.fillStyle = rg;
    g.beginPath();
    g.arc(cx, cy, R, 0, TAU);
    g.fill();
    g.strokeStyle = 'rgba(0,0,0,.55)';
    g.lineWidth = R * 0.07;
    for (let i = 0; i < 26; i++) {
      const a = (i / 26) * TAU;
      g.beginPath();
      g.moveTo(cx + Math.cos(a) * R * 0.86, cy + Math.sin(a) * R * 0.86);
      g.lineTo(cx + Math.cos(a) * R * 0.99, cy + Math.sin(a) * R * 0.99);
      g.stroke();
    }
    const mg = g.createRadialGradient(
      cx - r1 * 0.3,
      cy - r1 * 0.3,
      0,
      cx,
      cy,
      r1,
    );
    mg.addColorStop(0, '#f1f3f6');
    mg.addColorStop(0.7, '#a7aeb8');
    mg.addColorStop(1, '#6c737d');
    g.fillStyle = mg;
    g.beginPath();
    g.arc(cx, cy, r1, 0, TAU);
    g.fill();
    g.fillStyle = '#4c525b';
    for (let i = 0; i < 5; i++) {
      const a = (i / 5) * TAU - 1.57;
      g.beginPath();
      g.arc(
        cx + Math.cos(a) * r1 * 0.55,
        cy + Math.sin(a) * r1 * 0.55,
        r1 * 0.1,
        0,
        TAU,
      );
      g.fill();
    }
    g.fillStyle = '#d9dde3';
    g.beginPath();
    g.arc(cx, cy, r1 * 0.22, 0, TAU);
    g.fill();
  },
  can: (g, w, h) => {
    const metal = (x0, x1) => {
      const lg = g.createLinearGradient(x0, 0, x1, 0);
      lg.addColorStop(0, '#89939f');
      lg.addColorStop(0.25, '#f3f6f9');
      lg.addColorStop(0.5, '#c4cbd4');
      lg.addColorStop(0.85, '#7d8692');
      lg.addColorStop(1, '#5b636e');
      return lg;
    };
    const bodyTop = h * 0.38,
      neckTop = h * 0.13;
    rr(g, w * 0.04, bodyTop, w * 0.92, h - bodyTop, w * 0.08);
    g.fillStyle = metal(w * 0.04, w * 0.96);
    g.fill();
    g.beginPath();
    g.moveTo(w * 0.3, neckTop + h * 0.09);
    g.lineTo(w * 0.7, neckTop + h * 0.09);
    g.lineTo(w * 0.96, bodyTop + h * 0.02);
    g.lineTo(w * 0.04, bodyTop + h * 0.02);
    g.closePath();
    g.fillStyle = metal(w * 0.04, w * 0.96);
    g.fill();
    g.fillStyle = metal(w * 0.3, w * 0.7);
    g.fillRect(w * 0.3, neckTop, w * 0.4, h * 0.1);
    rr(g, w * 0.22, neckTop - h * 0.05, w * 0.56, h * 0.06, h * 0.015);
    g.fillStyle = metal(w * 0.22, w * 0.78);
    g.fill();
    g.fillStyle = '#6b737e';
    g.fillRect(w * 0.43, neckTop - h * 0.09, w * 0.14, h * 0.045);
    g.fillStyle = 'rgba(58,64,74,.45)';
    g.fillRect(w * 0.04, h * 0.56, w * 0.92, h * 0.02);
    g.fillRect(w * 0.04, h * 0.88, w * 0.92, h * 0.02);
    g.strokeStyle = '#737c88';
    g.lineWidth = w * 0.06;
    g.lineCap = 'round';
    g.beginPath();
    g.arc(
      w * 0.16,
      neckTop + h * 0.16,
      w * 0.12,
      Math.PI * 0.55,
      Math.PI * 1.45,
    );
    g.stroke();
    g.beginPath();
    g.arc(
      w * 0.84,
      neckTop + h * 0.16,
      w * 0.12,
      -Math.PI * 0.45,
      Math.PI * 0.45,
    );
    g.stroke();
  },
  barrier: (g, w, h) => {
    g.strokeStyle = '#3a3f49';
    g.lineWidth = w * 0.035;
    g.lineCap = 'round';
    for (const lx of [0.16, 0.84]) {
      g.beginPath();
      g.moveTo(w * (lx - 0.08), h);
      g.lineTo(w * lx, h * 0.3);
      g.lineTo(w * (lx + 0.08), h);
      g.stroke();
    }
    const by = h * 0.24,
      bh = h * 0.22;
    g.save();
    rr(g, 0, by, w, bh, bh * 0.2);
    g.clip();
    g.fillStyle = '#f4f5f7';
    g.fillRect(0, by, w, bh);
    g.fillStyle = '#d8262c';
    for (let x = -bh * 2; x < w + bh; x += bh * 1.2) {
      g.beginPath();
      g.moveTo(x, by + bh);
      g.lineTo(x + bh * 0.6, by + bh);
      g.lineTo(x + bh * 1.6, by);
      g.lineTo(x + bh, by);
      g.closePath();
      g.fill();
    }
    const lg = g.createLinearGradient(0, by, 0, by + bh);
    lg.addColorStop(0, 'rgba(255,255,255,.25)');
    lg.addColorStop(1, 'rgba(0,0,0,.28)');
    g.fillStyle = lg;
    g.fillRect(0, by, w, bh);
    g.restore();
    g.fillStyle = '#2b2e35';
    g.fillRect(w * 0.47, by - h * 0.08, w * 0.06, h * 0.08);
    const lamp = g.createRadialGradient(
      w * 0.5,
      by - h * 0.11,
      0,
      w * 0.5,
      by - h * 0.11,
      h * 0.09,
    );
    lamp.addColorStop(0, '#fff3b0');
    lamp.addColorStop(0.5, '#ffb81c');
    lamp.addColorStop(1, 'rgba(255,184,28,0)');
    g.fillStyle = lamp;
    g.beginPath();
    g.arc(w * 0.5, by - h * 0.11, h * 0.09, 0, TAU);
    g.fill();
  },
};
function buildObSprites() {
  for (const kind of /** @type {import('./types').ObstacleKind[]} */ (
    Object.keys(OB_PAINT)
  ))
    obSprites[kind] = sprite(OBS[kind].w, OBS[kind].h, OB_PAINT[kind]);
}

// ---------------------------------------------------------------- size-dependent buffers
/** @type {HTMLCanvasElement} */
let skyCv;
/** @type {HTMLCanvasElement} */
let vigCv;
/** @type {HTMLCanvasElement} */
let bA;
/** @type {HTMLCanvasElement} */
let bB;
/** @type {HTMLCanvasElement} */
let bC;
/** @type {CanvasRenderingContext2D} */
let bAg;
/** @type {CanvasRenderingContext2D} */
let bBg;
/** @type {CanvasRenderingContext2D} */
let bCg;
/** @type {CanvasPattern[]} */
let grainPats = [];
/** @type {HTMLCanvasElement[]} */
let grainTiles = [];

// небо уходит высоко вверх: камера поднимается за коровой на трамплинах
function buildSky() {
  geometry.skyOff = Math.ceil(H * 1.05);
  const oY = geometry.skyOff;
  const sh = Math.max(4, Math.ceil(geometry.horizon + oY + 6 * DPR));
  skyCv = mk(W * 1.24, sh);
  const g = skyCv.getContext('2d'),
    sw = skyCv.width;
  const total = oY + geometry.horizon,
    f = (y) => clamp(y / total, 0, 1);
  const lg = g.createLinearGradient(0, 0, 0, total);
  lg.addColorStop(0, '#244a9a');
  lg.addColorStop(f(oY), '#4673c6');
  lg.addColorStop(f(oY + geometry.horizon * 0.45), '#6792d9');
  lg.addColorStop(f(oY + geometry.horizon * 0.82), '#98b9e8');
  lg.addColorStop(1, '#bcd0ec');
  g.fillStyle = lg;
  g.fillRect(0, 0, sw, sh);
  const sun = g.createRadialGradient(
    sw * 0.1,
    oY - geometry.horizon * 0.25,
    0,
    sw * 0.1,
    oY - geometry.horizon * 0.25,
    sw * 0.75,
  );
  sun.addColorStop(0, 'rgba(255,252,240,0.38)');
  sun.addColorStop(1, 'rgba(255,252,240,0)');
  g.fillStyle = sun;
  g.fillRect(0, 0, sw, sh);
  const dark = g.createLinearGradient(
    sw,
    oY,
    sw * 0.45,
    oY + geometry.horizon * 0.6,
  );
  dark.addColorStop(0, 'rgba(22,40,92,0.3)');
  dark.addColorStop(1, 'rgba(22,40,92,0)');
  g.fillStyle = dark;
  g.fillRect(0, 0, sw, sh);
  const r = rng(5);
  for (let i = 0; i < 11; i++) {
    const x = r() * sw,
      y =
        oY +
        geometry.horizon * (0.08 + r() * 0.55) -
        (i > 6 ? r() * oY * 0.8 : 0);
    const rx = sw * (0.08 + r() * 0.16),
      ry = geometry.horizon * (0.012 + r() * 0.02);
    g.save();
    g.translate(x, y);
    g.scale(rx, ry);
    const cg = g.createRadialGradient(0, 0, 0, 0, 0, 1);
    cg.addColorStop(0, `rgba(235,242,252,${0.22 + r() * 0.2})`);
    cg.addColorStop(1, 'rgba(235,242,252,0)');
    g.fillStyle = cg;
    g.beginPath();
    g.arc(0, 0, 1, 0, TAU);
    g.fill();
    g.restore();
  }
}

// виньетка + тёмный правый низ, как на фото (при DOM-посте её рисует CSS-слой .vig)
function buildVignette() {
  if (cssPost) {
    vigCv = null;
    return;
  }
  vigCv = mk(W, H);
  const v = vigCv.getContext('2d'),
    R = Math.hypot(W, H) * 0.5;
  const rg = v.createRadialGradient(
    W * 0.47,
    H * 0.45,
    R * 0.3,
    W * 0.47,
    H * 0.45,
    R * 1.08,
  );
  rg.addColorStop(0, 'rgba(0,0,0,0)');
  rg.addColorStop(0.62, 'rgba(6,8,20,0.26)');
  rg.addColorStop(1, 'rgba(3,4,12,0.72)');
  v.fillStyle = rg;
  v.fillRect(0, 0, W, H);
  const br = v.createLinearGradient(W * 0.5, H * 0.45, W, H);
  br.addColorStop(0, 'rgba(0,0,0,0)');
  br.addColorStop(1, 'rgba(2,3,8,0.5)');
  v.fillStyle = br;
  v.fillRect(0, 0, W, H);
  const tl = v.createRadialGradient(0, 0, 0, 0, 0, Math.max(W, H) * 0.55);
  tl.addColorStop(0, 'rgba(255,246,225,0.10)');
  tl.addColorStop(1, 'rgba(255,246,225,0)');
  v.fillStyle = tl;
  v.fillRect(0, 0, W, H);
}

// буферы свечения
function buildGlowBuffers() {
  bA = mk(W / 4, H / 4);
  bB = mk(W / 16, H / 16);
  bAg = bA.getContext('2d');
  bBg = bB.getContext('2d');
  if (bloomG) {
    bloomEl.width = Math.max(1, W >> 2);
    bloomEl.height = Math.max(1, H >> 2);
    bloomG.imageSmoothingQuality = 'high';
    bC = null;
    bCg = null;
  } else {
    bC = mk(W / 4, H / 4);
    bCg = bC.getContext('2d');
    bCg.imageSmoothingQuality = 'high';
  }
}

// статичные градиенты земли — зависят только от геометрии кадра
function buildGroundGrads() {
  const yEnd = H * 1.2;
  geometry.hg = ctx.createLinearGradient(
    0,
    geometry.horizon,
    0,
    geometry.edgeY,
  );
  geometry.hg.addColorStop(0, 'rgba(160,180,210,0.86)');
  geometry.hg.addColorStop(0.18, 'rgba(128,148,178,0.45)');
  geometry.hg.addColorStop(0.6, 'rgba(90,106,130,0.12)');
  geometry.hg.addColorStop(1, 'rgba(60,70,90,0)');
  geometry.rg = ctx.createLinearGradient(0, geometry.edgeY, 0, yEnd);
  const mid = clamp(
    (geometry.refY - geometry.cowH * 0.12 - geometry.edgeY) /
      (yEnd - geometry.edgeY),
    0.05,
    0.95,
  );
  geometry.rg.addColorStop(0, 'rgba(96,120,150,0.42)');
  geometry.rg.addColorStop(mid * 0.7, 'rgba(60,76,100,0.14)');
  geometry.rg.addColorStop(mid, 'rgba(0,0,0,0)');
  geometry.rg.addColorStop(1, 'rgba(4,5,10,0.5)');
}

// зерно
function buildGrain() {
  grainPats = [];
  grainTiles = [];
  for (let k = 0; k < 3; k++) {
    const c = mk(160, 160),
      gg = c.getContext('2d'),
      img = gg.createImageData(160, 160),
      d = img.data;
    for (let i = 0; i < d.length; i += 4) {
      const q = 128 + (Math.random() - 0.5) * 150;
      d[i] = d[i + 1] = d[i + 2] = q;
      d[i + 3] = 255;
    }
    gg.putImageData(img, 0, 0);
    grainTiles.push(c);
    grainPats.push(ctx.createPattern(c, 'repeat'));
  }
}

function buildSizeDependent() {
  buildSky();
  buildVignette();
  buildGlowBuffers();
  buildGroundGrads();
  buildGrain();
}

/** @type {import('./types').CowImages} */
let imgs;
/** @type {HTMLCanvasElement} */
let ghostCv;
/** @type {HTMLCanvasElement} */
let streakCv;
/** @type {import('./types').Streak[]} */
let streaks = [];
/** @type {HTMLCanvasElement} */
let dustImg;
/** @type {HTMLCanvasElement} */
let woodImg;
/** @type {HTMLCanvasElement} */
let lineImg;
/** @type {HTMLCanvasElement} */
let shadowImg;
/** @type {HTMLCanvasElement} */
let glowImg;

// мягкая тень — один спрайт вместо радиального градиента на каждый кадр
/** @returns {HTMLCanvasElement} */
function makeShadow() {
  const c = mk(128, 128),
    g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(3,4,9,1)');
  gr.addColorStop(0.55, 'rgba(3,4,9,0.55)');
  gr.addColorStop(1, 'rgba(3,4,9,0)');
  g.fillStyle = gr;
  g.fillRect(0, 0, 128, 128);
  return c;
}
const GHOST_BLUR = 40;

function buildCowCaches() {
  const b = META.base;
  const full = mk(b.w, b.h),
    g = full.getContext('2d');
  g.drawImage(imgs.board, META.board.x - b.x, META.board.y - b.y);
  g.drawImage(imgs.base, 0, 0);
  g.drawImage(imgs.ear, META.ear.x - b.x, META.ear.y - b.y);
  g.drawImage(imgs.tag, META.tag.x - b.x, META.tag.y - b.y);

  // размытая копия для призрачного шлейфа (смаз только назад)
  ghostCv = mk(b.w + GHOST_BLUR, b.h);
  const gg = ghostCv.getContext('2d'),
    n = 12;
  gg.globalCompositeOperation = 'lighter';
  gg.globalAlpha = 1 / n;
  for (let i = 0; i < n; i++)
    gg.drawImage(full, GHOST_BLUR - (i * GHOST_BLUR) / (n - 1), 0);

  // полосы смаза от заднего края силуэта (как размытый зад коровы на фото)
  try {
    const d = g.getImageData(0, 0, b.w, b.h).data;
    for (let y = 0; y < b.h; y += 2) {
      let x0 = -1;
      for (let x = 0; x < b.w; x++)
        if (d[(y * b.w + x) * 4 + 3] > 115) {
          x0 = x;
          break;
        }
      if (x0 < 0) continue;
      let r = 0,
        gr = 0,
        bl = 0,
        k = 0;
      for (let x = x0; x < Math.min(b.w, x0 + 8); x++) {
        const i = (y * b.w + x) * 4;
        if (d[i + 3] > 100) {
          r += d[i];
          gr += d[i + 1];
          bl += d[i + 2];
          k++;
        }
      }
      if (!k) continue;
      const sy = y + b.y;
      const wgt = sy < 150 ? 0.32 : sy < 470 ? 1 : 0.6;
      streaks.push({
        x: x0 + b.x + 4,
        y: sy,
        c: [(r / k) | 0, (gr / k) | 0, (bl / k) | 0],
        w: wgt * (0.6 + Math.random() * 0.4),
        f: rand(2.5, 9),
        ph: rand(0, TAU),
        base: rand(0.55, 1),
      });
    }
    streakCv = mk(128, streaks.length * 4);
    const sg = streakCv.getContext('2d');
    streaks.forEach((s, i) => {
      const [r, gg2, bb] = s.c;
      const lg = sg.createLinearGradient(0, 0, 128, 0);
      lg.addColorStop(0, `rgba(${r},${gg2},${bb},0)`);
      lg.addColorStop(0.72, `rgba(${r},${gg2},${bb},0.5)`);
      lg.addColorStop(1, `rgba(${r},${gg2},${bb},1)`);
      sg.fillStyle = lg;
      sg.fillRect(0, i * 4, 128, 4);
    });
  } catch (e) {
    streaks = [];
  }
}

function initClouds() {
  const r = rng(99);
  const sprites = [
    makeCloud(1, 900, 330, 46),
    makeCloud(2, 700, 260, 36),
    makeCloud(3, 520, 200, 28),
    makeCloud(4, 380, 150, 20),
    makeCloud(6, 1100, 260, 52, true),
    makeCloud(7, 620, 240, 32),
    makeCloud(8, 460, 170, 24),
    makeCloud(9, 820, 220, 40, true),
  ];
  const N = 16;
  for (let i = 0; i < N; i++) {
    const depth = clamp((i / (N - 1)) * 0.9 + r() * 0.12, 0, 1); // 0 — высоко и близко, 1 — у горизонта
    clouds.push({
      img: sprites[(i * 5) % sprites.length],
      x: r(),
      gap: 0.1 + r() * 0.8,
      yN: 0.03 + depth * 0.8,
      scale: lerp(1.3, 0.3, depth) * (0.8 + r() * 0.4),
      par: lerp(0.012, 0.0025, depth),
      drift: lerp(0.018, 0.005, depth),
      alpha: lerp(1, 0.7, depth),
    });
  }
  for (let i = 0; i < 7; i++) {
    // облака выше кадра — видны, когда камера взлетает
    clouds.push({
      img: sprites[(i * 3 + 1) % sprites.length],
      x: r(),
      gap: 0.2 + r() * 0.8,
      yN: -0.15 - r() * 1.2,
      scale: 1.2 + r() * 0.5,
      par: 0.014,
      drift: 0.02,
      alpha: 1,
    });
  }
  clouds.sort((a, b) => b.yN - a.yN);
}

// ---------------------------------------------------------------- text sprites
// Надписи кадра («+50», «!», имена трюков) растеризуются один раз и дальше
// идут через drawImage: strokeText/fillText на каждом кадре — заметная
// доля бюджета на слабом железе, плюс строка ctx.font аллоцируется заново.
// Ключ — текст + размер + стили: повторяющиеся надписи («+50», «360»…)
// переиспользуются и между появлениями, и между drawPops/drawMarkers.
/** @type {Map<string, HTMLCanvasElement>} */
const textCache = new Map();
/** @type {CanvasRenderingContext2D | null} */
let textMeasure = null;
/**
 * @param {string} text
 * @param {number} px размер шрифта в пикселях буфера (как в ctx.font)
 * @param {string} fill цвет заливки
 * @param {string | null} [stroke] цвет обводки (нет — без обводки)
 * @param {number} [lw] толщина обводки в пикселях
 * @returns {HTMLCanvasElement} спрайт с текстом по центру
 */
function textSprite(text, px, fill, stroke, lw = 0) {
  px = Math.round(px * 10) / 10;
  const key = `${text}|${px}|${fill}|${stroke || ''}|${lw}`;
  const cached = textCache.get(key);
  if (cached) return cached;
  const font = `800 ${px}px Unbounded, "Arial Black", Impact, system-ui, sans-serif`;
  if (!textMeasure) textMeasure = mk(2, 2).getContext('2d');
  const mg = /** @type {CanvasRenderingContext2D} */ (textMeasure);
  mg.font = font;
  const tw = mg.measureText(text).width;
  const padX = lw + px * 0.16 + 2,
    padY = lw + px * 0.34 + 2;
  const spr = mk(tw + padX * 2, px + padY * 2),
    g = /** @type {CanvasRenderingContext2D} */ (spr.getContext('2d'));
  g.font = font;
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.lineJoin = 'round';
  if (stroke && lw > 0) {
    g.strokeStyle = stroke;
    g.lineWidth = lw;
    g.strokeText(text, spr.width / 2, spr.height / 2);
  }
  g.fillStyle = fill;
  g.fillText(text, spr.width / 2, spr.height / 2);
  // кэш ограничен: старейшую запись вытесняем — при resize размеры
  // пересобираются под новый масштаб сами
  if (textCache.size >= 64)
    textCache.delete(/** @type {string} */ (textCache.keys().next().value));
  textCache.set(key, spr);
  return spr;
}

// ---- game/events.js
// ---------------------------------------------------------------- events
// Шина событий модели (карта рефакторинга, этап 3, D6): платформенный
// EventTarget доставляет событие синхронно в порядке подписки, поэтому
// emit() эквивалентен прямому вызову подписчиков на месте — порядок
// побочных эффектов и последовательность Math.random не меняются.

/** @type {EventTarget} */
const bus = new EventTarget();

/**
 * @template {keyof import('./types').GameEventMap} K
 * @param {K} type имя события
 * @param {import('./types').EventDetail<K>} detail полезная нагрузка
 */
function emit(type, detail) {
  bus.dispatchEvent(new CustomEvent(type, { detail }));
}

/**
 * @template {keyof import('./types').GameEventMap} K
 * @param {K} type имя события
 * @param {(detail: import('./types').EventDetail<K>) => void} fn подписчик
 */
function on(type, fn) {
  bus.addEventListener(type, (e) => fn(/** @type {CustomEvent} */ (e).detail));
}

// ---- game/track/ramp.js
// Кикер (невысокий трамплин-клин): ground — подъём по склону, с края —
// вылет в launch(). Хуков collide/ride нет — конструкция проезжаемая.

/**
 * @param {number[][]} pts
 * @param {string | CanvasGradient | CanvasPattern} style
 * @param {number} dx
 */
function fillPoly(pts, style, dx) {
  ctx.beginPath();
  ctx.moveTo(pts[0][0] + dx, pts[0][1]);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0] + dx, pts[i][1]);
  ctx.closePath();
  ctx.fillStyle = style;
  ctx.fill();
}
// трамплин: деревянный клин в перспективе (боковая стенка, настил, металлический край)
/**
 * @param {import('../types').RampFeature} f
 * @param {number} blur смаз по x в пикселях
 */
function drawRamp(f, blur) {
  const q = obZ(f.x0 - state.camX),
    zn = 0.8 * q,
    zf = 1.28 * q,
    hh = f.data.hr * geometry.cowH;
  /** @type {(X: number, h: number, z: number) => number[]} */
  const P = (X, h, z) => [geometry.vx + (X - state.camX) / z, yAt(z) - h / z];
  const A = P(f.x0, 0, zn),
    B = P(f.x1, hh, zn),
    C = P(f.x1, hh, zf),
    D = P(f.x0, 0, zf);
  const F = P(f.x1, 0, zn),
    Gp = P(f.x1, 0, zf);
  if (Math.max(B[0], F[0]) < X0() - 60 || Math.min(A[0], D[0]) > X1() + 60)
    return;
  const fa = clamp((geometry.zEdge * 1.12 - zf) * 2.4, 0, 1); // проступает из дали
  if (fa <= 0.02) return;
  const shadowLen = 0.35 * geometry.cowH;
  const shape = (dx, alpha) => {
    ctx.globalAlpha = alpha;
    fillPoly(
      [F, Gp, [Gp[0] + shadowLen / zf, Gp[1]], [F[0] + shadowLen / zn, F[1]]],
      'rgba(4,5,10,0.35)',
      dx,
    );
    fillPoly([F, B, C, Gp], '#5a391b', dx);
    const tg = ctx.createLinearGradient(A[0] + dx, A[1], B[0] + dx, B[1]);
    tg.addColorStop(0, '#8a5c2f');
    tg.addColorStop(1, '#cc9655');
    fillPoly([A, B, C, D], tg, dx);
    ctx.strokeStyle = 'rgba(70,42,18,0.55)';
    ctx.lineWidth = Math.max(1, 1.3 * geometry.u);
    ctx.beginPath();
    for (let i = 1; i < 6; i++) {
      const z = zn + ((zf - zn) * i) / 6,
        a = P(f.x0, 0, z),
        b = P(f.x1, hh, z);
      ctx.moveTo(a[0] + dx, a[1]);
      ctx.lineTo(b[0] + dx, b[1]);
    }
    ctx.stroke();
    const sg = ctx.createLinearGradient(0, B[1], 0, F[1]);
    sg.addColorStop(0, '#76491f');
    sg.addColorStop(1, '#4a2c12');
    fillPoly([A, F, B], sg, dx);
    ctx.strokeStyle = 'rgba(40,24,10,0.7)';
    ctx.lineWidth = Math.max(1, 2.2 * geometry.u);
    ctx.beginPath();
    for (const k of [0.4, 0.72]) {
      const t = P(f.x0 + (f.x1 - f.x0) * k, hh * k, zn),
        b = P(f.x0 + (f.x1 - f.x0) * k, 0, zn);
      ctx.moveTo(t[0] + dx, t[1]);
      ctx.lineTo(b[0] + dx, b[1]);
    }
    ctx.stroke();
    ctx.strokeStyle = '#dfe4ea';
    ctx.lineWidth = Math.max(1.5, 3.2 * geometry.u);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(B[0] + dx, B[1]);
    ctx.lineTo(C[0] + dx, C[1]);
    ctx.stroke();
  };
  shape((blur * 0.8) / q, 0.3 * fa);
  shape(0, fa);
  ctx.globalAlpha = 1;
}

/** @type {import('../types').FeatureTypeSpec<import('../types').RampData, 'ramp'>} */
const rampSpec = {
  type: 'ramp',
  weight: 24,
  minGapBeforeCowH: 12,
  special: true,
  plan(ctx) {
    return {
      data: { hr: 0.3 },
      lengthCowH: 1.15,
      gapAfterCowH: ctx.rand(12, 17) * Math.max(1, 0.8 * ctx.spdN),
    };
  },
  ground(feat, X) {
    if (X < feat.x0 || X > feat.x1) return null;
    const k = (X - feat.x0) / (feat.x1 - feat.x0);
    return {
      h: feat.data.hr * k,
      slope: (feat.data.hr * geometry.cowH) / (feat.x1 - feat.x0),
    };
  },
  autopilot(feat) {
    // покатушечная конструкция: действий не нужно, но для проверки
    // «есть ли место для флёртиша» отвечаем своим въездом
    return feat.x1 > boardX()
      ? { at: feat.x0, leadS: 0, action: 'none' }
      : null;
  },
  depth: (feat) => obZ(feat.x0 - state.camX) * 1.06,
  draw: drawRamp,
};

// ---- game/score.js
// ---------------------------------------------------------------- score
// Модель счёта и рекорда (карта, этап 3): DOM — в ui.js, всплывашки —
// в effects.js; оба слоя реагируют на событие 'score'.

/**
 * @param {number} pts очки (уже с учётом множителя комбо)
 * @param {number} [mult] множитель комбо — для показа «×N»
 */
function addScore(pts, mult = 1) {
  state.score += pts;
  emit('score', { points: pts, mult, total: state.score });
  if (state.score > state.best) endRun();
}

/** Обновляет рекорд и шлёт событие конца заезда (счёт уходит в Telegram). */
function endRun() {
  if (state.score > state.best) {
    state.best = state.score;
    try {
      localStorage.setItem('cow-skate-best', String(state.best));
    } catch (e) {
      /* ок */
    }
    document.dispatchEvent(
      new CustomEvent('cowskate:run-end', {
        detail: { score: state.score, best: state.best },
      }),
    );
  }
}

/** Начисляет очки за трюки воздуха при приземлении. */
function award() {
  const list = state.airTricks,
    tricks = list.filter((k) => k !== 'double');
  let pts = state.airBonus;
  for (const k of list) pts += k === 'double' ? 30 : TRICKS[k].pts;
  state.airTricks = [];
  state.airBonus = 0;
  if (!pts || !playerMode()) return;
  const mult = Math.max(1, tricks.length);
  addScore(pts * mult, mult);
}

/** Подписывает счёт на события модели (композиция — в main.js). */
function initScore() {
  on('land', award);
  on('crash', () => {
    if (!playerMode()) return;
    endRun();
    state.score = 0;
  });
}

// ---- game/track/obstacle.js
// Препятствие: перепрыгнуть (`collide`), сбитое — летит обломком
// (`step`, `drawFlying`), маркер-подсказка над спрайтом и значок у края.

const OBS_ENTRIES = /** @type {import('../types').ObstacleEntry[]} */ (
  Object.entries(OBS)
);
const OBS_TOTAL = OBS_ENTRIES.reduce((a, [, o]) => a + o.wt, 0);

/** @param {import('../types').ObstacleFeature} f центр по мировой оси */
const mid = (f) => (f.x0 + f.x1) / 2;

/**
 * Отбросить обломок: задаёт fly-полёт и встряхивает камеру.
 * @param {import('../types').ObstacleFeature} f
 * @param {number} power
 */
function knock(f, power) {
  f.data.fly = {
    h: 0.02,
    vh: rand(1.6, 2.6) * power,
    vx: rand(0.7, 1.5) * power,
    rot: 0,
    vr: rand(-13, 13) * power,
  };
  state.shake = Math.min(1.8, state.shake + 0.4);
}

/**
 * @param {import('../types').ObstacleKind} kind
 * @param {number} x
 * @param {number} y
 * @param {number} rot
 * @param {number} blur
 * @param {number} zs
 * @param {number} [al]
 */
function drawObSprite(kind, x, y, rot, blur, zs, al) {
  const spr = obSprites[kind],
    sc = (geometry.cowH * (zs || 1)) / OBR,
    a = al === undefined ? 1 : al;
  const w = spr.width * sc,
    h = spr.height * sc,
    p = spr.pad * sc;
  if (rot) {
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(x, y - (h - 2 * p) / 2);
    ctx.rotate(rot);
    ctx.drawImage(spr, -w / 2, -h / 2, w, h);
    ctx.restore();
    return;
  }
  const x0 = x - w / 2,
    y0 = y - h + p;
  for (let i = 3; i >= 1; i--) {
    ctx.globalAlpha = 0.13 * (4 - i) * a;
    ctx.drawImage(spr, x0 + (blur * i) / 3, y0, w, h);
  }
  ctx.globalAlpha = a;
  ctx.drawImage(spr, x0, y0, w, h);
}
/**
 * @param {number} x
 * @param {number} y
 * @param {number} rx
 * @param {number} ry
 * @param {number} a
 */
function groundShadow(x, y, rx, ry, a) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(rx / 64, ry / 64);
  ctx.globalAlpha = a;
  ctx.drawImage(shadowImg, -64, -64);
  ctx.restore();
}
// тёплое свечение под препятствием — отделяет тёмный спрайт от тёмного асфальта
/**
 * @param {number} x
 * @param {number} y
 * @param {number} rx
 * @param {number} ry
 * @param {number} a
 */
function groundGlow(x, y, rx, ry, a) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(rx / 64, ry / 64);
  ctx.globalCompositeOperation = 'screen';
  ctx.globalAlpha = a;
  ctx.drawImage(glowImg, -64, -64);
  ctx.restore();
}

/** @type {import('../types').FeatureTypeSpec<import('../types').ObstacleData, 'ob'>} */
const obstacleSpec = {
  type: 'ob',
  weight: 76,
  minGapBeforeCowH: 7.5,
  plan(ctx) {
    let r = ctx.rand(0, OBS_TOTAL);
    /** @type {import('../types').ObstacleKind} */
    let kind = 'cone';
    for (const [k, o] of OBS_ENTRIES) {
      r -= o.wt;
      if (r <= 0) {
        kind = k;
        break;
      }
    }
    const o = OBS[kind];
    return {
      data: { kind, isOver: false, isCleared: false, fly: null },
      lengthCowH: o.w,
      gapAfterCowH: ctx.rand(7.5, 13) * Math.max(1, 0.8 * ctx.spdN),
    };
  },
  collide(feat, X, h) {
    const d = feat.data,
      o = OBS[d.kind],
      hb = 0.2 * geometry.cowH;
    if (d.fly) return 'clear';
    if (X + hb > feat.x0 && X - hb < feat.x1) {
      if (state.mode === 'crash' || state.invuln > 0) {
        if (h < o.h) knock(feat, 0.7);
        return 'clear';
      }
      if (h < o.h * 0.85) {
        knock(feat, 1);
        return 'hit';
      }
      d.isOver = true;
      return 'over';
    }
    if (d.isOver && !d.isCleared && X - hb >= feat.x1) {
      d.isCleared = true;
      // очки за взятое препятствие — сразу, а не при приземлении: быстрый отклик учит лучше
      if (playerMode()) addScore(50);
    }
    return 'clear';
  },
  step(feat, dt) {
    const q = feat.data.fly;
    if (!q) return;
    q.vh -= GRAV * dt;
    q.h += q.vh * dt;
    q.rot += q.vr * dt;
    const dX = q.vx * geometry.cowH * dt;
    feat.x0 += dX;
    feat.x1 += dX;
    if (q.h <= 0) {
      q.h = 0;
      q.vh = Math.abs(q.vh) > 0.7 ? -q.vh * 0.35 : 0;
      q.vr *= 0.55;
      q.vx *= 0.5;
    }
  },
  autopilot(feat) {
    const o = OBS[feat.data.kind],
      Xb = boardX(),
      hb = 0.2 * geometry.cowH,
      dbl = !!(o.long || o.tall);
    if (feat.data.fly || feat.x1 <= Xb - hb) return null;
    return {
      at: mid(feat),
      leadS: dbl ? 0.5 : 0.3,
      action: dbl ? 'double' : 'jump',
    };
  },
  marker(feat) {
    const d = feat.data;
    if (d.fly || d.isOver) return null;
    const o = OBS[d.kind],
      dbl = !!(o.long || o.tall);
    return {
      label: dbl ? '×2' : '!',
      leadS: dbl ? 0.5 : 0.3,
      heightCowH: o.h + 0.06,
      icon: obSprites[d.kind],
    };
  },
  depth: (feat) => (feat.data.fly ? 0 : obPos(mid(feat))[2]),
  draw(feat, blur) {
    const d = feat.data;
    if (d.fly) return;
    const o = OBS[d.kind],
      [x, y, z] = obPos(mid(feat));
    if (x < X0() - geometry.cowH || x > X1() + geometry.cowH) return;
    const a = clamp((geometry.zEdge * 1.12 - z) * 2.4, 0, 1); // проступают из дали
    if (a <= 0.02) return;
    ctx.globalAlpha = 1;
    groundGlow(
      x,
      y - (0.01 * geometry.cowH) / z,
      (o.w * geometry.cowH * 0.85) / z,
      (0.09 * geometry.cowH) / z,
      0.2 * a,
    );
    groundShadow(
      x + (0.03 * geometry.cowH) / z,
      y,
      (o.w * geometry.cowH * 0.62) / z,
      (0.035 * geometry.cowH) / z,
      0.55 * a,
    );
    drawObSprite(d.kind, x, y, 0, blur / z, 1 / z, a);
  },
  drawFlying(feat) {
    const d = feat.data;
    if (!d.fly) return;
    const [x, y, z] = obPos(mid(feat));
    if (x < X0() - geometry.cowH || x > X1() + geometry.cowH) return;
    groundShadow(
      x,
      y,
      (OBS[d.kind].w * geometry.cowH * 0.5) / (z * (1 + d.fly.h * 2)),
      (0.03 * geometry.cowH) / z,
      0.4,
    );
    drawObSprite(
      d.kind,
      x,
      y - (d.fly.h * geometry.cowH) / z,
      d.fly.rot || 0.001,
      0,
      1 / z,
    );
  },
};

// ---- game/track/loop.js
// Мёртвая петля (gameplay-ux-plan §B): ride-конструкция — корова катит по
// внутренней поверхности кольца. Траектория параметрическая: дуга s ∈
// [0, 2πR]; гравитация честная (тангенциальная составляющая −g·sinθ),
// в верхней трети дуги действует магнитная помощь (ASSIST < 1) — рельс
// держит доску. Не добрал скорость — откат назад и мягкий выход без
// крэша (повторный заезд запрещён флагом data.isTried).

const R = 1.0; // радиус петли, cowH: кольцо 2 роста — читается, вход ~5.2 cowH/с
const PAD = 0.5; // ровная полка до/после круга, cowH
const ASSIST = 0.55; // ослабление g в верхней трети — «магнитная» помощь рельса
const TOP0 = 2.05,
  TOP1 = TAU - 2.05; // дуга верхней трети (рад от нижней точки)

/** @param {import('../types').LoopFeature} f @returns {number} мировой X входа (низ круга) */
const entryX = (f) => f.x0 + f.data.entry * geometry.cowH;

/**
 * Точка дуги в экранных координатах для стенки глубиной z и радиуса k·R.
 * θ = 0 — низ петли, θ = π — верх.
 * @type {(th: number, z: number, k: number, Xc: number, rPx: number) => number[]}
 */
const arcPt = (th, z, k, Xc, rPx) => {
  const r = (rPx * k) / z;
  return [
    geometry.vx + (Xc - state.camX) / z + r * Math.sin(th),
    yAt(z) - rPx / z - r * Math.cos(th),
  ];
};

// две стенки кольца в перспективе + шпалы между ними, опоры и бортик
/**
 * @param {import('../types').LoopFeature} f
 * @param {number} blur смаз по x в пикселях
 */
function drawLoop(f, blur) {
  const Xc = entryX(f),
    rPx = f.data.r * geometry.cowH,
    q = obZ(Xc - state.camX),
    zn = 0.8 * q,
    zf = 1.28 * q;
  const a = (th, z, k) => arcPt(th, z, k, Xc, rPx);
  // отсечение: вся конструкция за кадром
  if (
    geometry.vx + (Xc + rPx - state.camX) / zn < X0() - 80 ||
    geometry.vx + (Xc - rPx - state.camX) / zf > X1() + 80
  )
    return;
  const fa = clamp((geometry.zEdge * 1.12 - zf) * 2.4, 0, 1);
  if (fa <= 0.02) return;
  /** @param {number} dx @param {number} alpha */
  const shape = (dx, alpha) => {
    ctx.globalAlpha = alpha;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    // тень-пятно под конструкцией
    ctx.fillStyle = 'rgba(4,5,10,0.3)';
    ctx.beginPath();
    ctx.ellipse(
      geometry.vx + (Xc - state.camX) / zn + dx,
      yAt(zn),
      (rPx * 1.3) / zn,
      0.09 * geometry.cowH,
      0,
      0,
      TAU,
    );
    ctx.fill();
    // опоры: по две стойки на стенку под боковые точки дуги
    ctx.strokeStyle = '#4a2c12';
    ctx.lineWidth = Math.max(1.2, 4 * geometry.u);
    ctx.beginPath();
    for (const z of [zn, zf])
      for (const th of [Math.PI * 0.62, Math.PI * 1.38]) {
        const p = a(th, z, 1);
        ctx.moveTo(p[0] + dx, p[1]);
        ctx.lineTo(p[0] + dx, yAt(z));
      }
    ctx.stroke();
    // шпалы: радиальные связи между стенками
    ctx.strokeStyle = 'rgba(70,42,18,0.8)';
    ctx.lineWidth = Math.max(1, 2.6 * geometry.u);
    ctx.beginPath();
    for (let i = 0; i < 16; i++) {
      const th = (i / 16) * TAU,
        p0 = a(th, zn, 0.93),
        p1 = a(th, zf, 0.93);
      ctx.moveTo(p0[0] + dx, p0[1]);
      ctx.lineTo(p1[0] + dx, p1[1]);
    }
    ctx.stroke();
    // кольцевое полотно: внешний и внутренний край обеих стенок
    for (const [z, shade] of /** @type {[number, string][]} */ ([
      [zf, '#6b451f'],
      [zn, '#8a5c2f'],
    ]))
      for (const k of [1.08, 0.86]) {
        ctx.strokeStyle = shade;
        ctx.lineWidth = Math.max(1.2, (k > 1 ? 4.6 : 3.6) * geometry.u);
        ctx.beginPath();
        for (let i = 0; i <= 40; i++) {
          const p = a((i / 40) * TAU, z, k);
          if (i) ctx.lineTo(p[0] + dx, p[1]);
          else ctx.moveTo(p[0] + dx, p[1]);
        }
        ctx.stroke();
      }
    // металлический бортик ближней стенки
    ctx.strokeStyle = '#dfe4ea';
    ctx.lineWidth = Math.max(1.5, 3.4 * geometry.u);
    ctx.beginPath();
    for (let i = 0; i <= 40; i++) {
      const p = a((i / 40) * TAU, zn, 0.97);
      if (i) ctx.lineTo(p[0] + dx, p[1]);
      else ctx.moveTo(p[0] + dx, p[1]);
    }
    ctx.stroke();
  };
  shape((blur * 0.8) / q, 0.3 * fa);
  shape(0, fa);
  ctx.globalAlpha = 1;
}

/** Ближний рельс поверх коровы — она едет внутри кольца, за ним. */
function drawLoopFront(f) {
  const Xc = entryX(f),
    rPx = f.data.r * geometry.cowH,
    zn = 0.8 * obZ(Xc - state.camX);
  if (
    geometry.vx + (Xc + rPx - state.camX) / zn < X0() - 60 ||
    geometry.vx + (Xc - rPx - state.camX) / zn > X1() + 60
  )
    return;
  const a = (th) => arcPt(th, zn, 1.08, Xc, rPx);
  ctx.strokeStyle = '#a5713b';
  ctx.lineWidth = Math.max(1.4, 4.6 * geometry.u);
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i <= 40; i++) {
    const p = a((i / 40) * TAU);
    if (i) ctx.lineTo(p[0], p[1]);
    else ctx.moveTo(p[0], p[1]);
  }
  ctx.stroke();
}

/** @type {import('../types').FeatureTypeSpec<import('../types').LoopData, 'loop'>} */
const loopSpec = {
  type: 'loop',
  weight: 6,
  minGapBeforeCowH: 15, // разбег перед петлёй без конструкций
  special: true,
  plan(ctx) {
    return {
      data: { r: R, entry: R + PAD, isTried: false },
      lengthCowH: 2 * (R + PAD),
      // за выездом — чистая зона приземления
      gapAfterCowH: ctx.rand(18, 24) * Math.max(1, 0.8 * ctx.spdN),
    };
  },
  ride: {
    tricks: true,
    canEnter(feat, st) {
      const Xb = boardX();
      return (
        st.mode === 'ground' &&
        !feat.data.isTried &&
        Xb >= entryX(feat) &&
        // только в момент пересечения входа: приземлился позже — проехал мимо
        Xb < entryX(feat) + 0.4 * geometry.cowH
      );
    },
    length: (feat) => TAU * feat.data.r,
    path(feat, s) {
      const th = s / feat.data.r;
      return {
        X: entryX(feat) + feat.data.r * geometry.cowH * Math.sin(th),
        h: feat.data.r * (1 - Math.cos(th)),
        angle: -th, // касательная в canvas-угле: вверх — против часовой
      };
    },
    step(feat, ride, dt) {
      const th = ride.s / feat.data.r,
        g = GRAV * (th > TOP0 && th < TOP1 ? ASSIST : 1);
      ride.v -= g * Math.sin(th) * dt;
      ride.s += ride.v * dt;
      // прошёл круг или откатился назад через вход — конструкция «used»
      if (ride.s >= TAU * feat.data.r || (ride.s < 0 && ride.v < 0)) {
        feat.data.isTried = true;
        return 'exit';
      }
      return 'ride';
    },
  },
  marker: (feat) =>
    feat.data.isTried || state.ride?.feat === feat
      ? null
      : { label: 'ГАЗ', leadS: 1.5, heightCowH: 1.1 },
  autopilot(feat) {
    if (feat.data.isTried || boardX() > entryX(feat)) return null;
    // зажать разгон заранее — к входу нужна скорость выше крейсерской
    return { at: entryX(feat), leadS: 1.7, action: 'hold' };
  },
  depth: (feat) => obZ(entryX(feat) - state.camX) * 1.06,
  draw: drawLoop,
  drawFlying: drawLoopFront,
};

// ---- game/track/index.js
// Реестр видов конструкций (карта, этап 5, D4): добавить вид =
// + запись здесь. Движок не знает типов — диспетчит по этой таблице.

/** @type {Record<string, import('../types').FeatureTypeSpec>} */
const FEATURE_TYPES = {
  ramp: rampSpec,
  ob: obstacleSpec,
  loop: loopSpec,
};

// ---- game/pose.js
// ---------------------------------------------------------------- pose → matrix
/** @type {import('./types').Vec2} */
const PIV = [200, 540]; // центр доски в координатах фото — вокруг него наклон
/** @type {import('./types').Vec2} */
const CEN = [300, 330]; // центр коровы — вокруг него сальто и 360
/**
 * @param {import('./types').Pose} p
 * @returns {DOMMatrix}
 */
function poseMatrix(p) {
  const sqX = 1 + (1 - p.sq) * 0.55;
  const m = new DOMMatrix()
    .translate(
      geometry.ox + PIV[0] * geometry.s + (p.x || 0),
      geometry.oy + PIV[1] * geometry.s + p.y * geometry.cowH,
    )
    .rotate(p.tilt * DEG)
    .scale(geometry.s * sqX, geometry.s * p.sq)
    .translate(CEN[0] - PIV[0], CEN[1] - PIV[1]);
  if (p.roll) m.rotateSelf(p.roll * DEG);
  if (p.spin) {
    let c = Math.cos(p.spin);
    if (Math.abs(c) < 0.03) c = c < 0 ? -0.03 : 0.03;
    m.scaleSelf(c, 1);
  }
  return m.translateSelf(-CEN[0], -CEN[1]);
}
/** @returns {import('./types').Pose} текущая поза коровы */
const curPose = () => ({
  y: state.bob + vib() - state.h,
  tilt: state.tilt,
  sq: state.sq,
  spin: state.spin,
  // на ride-конструкции к кувырку добавляется угол касательной дуги
  roll: state.roll + (state.ride ? state.ride.ang : 0),
});
/**
 * @param {DOMMatrix} m
 * @param {number} ang
 * @param {number} drop
 * @returns {DOMMatrix}
 */
function kickT(m, ang, drop) {
  const [a, b] = META.board.axis,
    cx = (a[0] + b[0]) / 2,
    cy = (a[1] + b[1]) / 2;
  const al = Math.atan2(b[1] - a[1], b[0] - a[0]) * DEG;
  let k = Math.cos(ang);
  if (Math.abs(k) < 0.04) k = k < 0 ? -0.04 : 0.04;
  return m
    .translate(0, drop)
    .translate(cx, cy)
    .rotate(al)
    .scale(1, k)
    .rotate(-al)
    .translate(-cx, -cy);
}
/** @param {DOMMatrix} m @returns {DOMMatrix} */
function boardMatrix(m) {
  const c = state.crash;
  if (c)
    return kickT(
      poseMatrix({
        x: c.bx * geometry.cowH,
        y: state.bob - c.bh,
        tilt: c.brot,
        sq: 1,
      }),
      c.bkick,
      0,
    );
  return state.kick || state.kickDrop
    ? kickT(m, state.kick, state.kickDrop)
    : m;
}
/** @returns {number} вибрация подвески на ходу */
function vib() {
  if (!onFlat()) return 0;
  const t = state.t,
    a = (reduce ? 0.35 : 1) * 0.0016 * state.spdN;
  return (
    a *
    (Math.sin(t * 47.1) * 0.5 +
      Math.sin(t * 73.3 + 1.1) * 0.3 +
      nE(t * 38) * 0.6)
  );
}
/** @returns {import('./types').WheelPoint[]} колёса в экранных координатах */
function wheelsScreen() {
  const m = poseMatrix({
    y: state.bob + vib() - state.h,
    tilt: state.tilt,
    sq: state.sq,
  });
  return META.contact.map(([x, y]) => {
    const p = m.transformPoint(new DOMPoint(x, y));
    return { x: p.x, y: p.y, z: zAt(Math.max(p.y, geometry.horizon + 5)) };
  });
}

// ---- game/camera.js
// Камера владеет своей матрицей (карта, этап 4): читатели импортируют
// живой биндинг CAM, пишет его только stepCamera.
/** Матрица камеры кадра: тряска, зум от скорости, подъём за коровой. */
let CAM = new DOMMatrix();

/**
 * Тряска, зум от скорости, подъём за коровой в большом прыжке.
 * @param {number} dt шаг кадра, секунды
 */
function stepCamera(dt) {
  state.shake = Math.max(0, state.shake - dt * 2.4);
  const apex =
    state.mode === 'air' && state.hV > 0
      ? state.h + (state.hV * state.hV) / (2 * GRAV)
      : state.h;
  const hT = state.mode === 'air' ? lerp(state.h, apex, 0.6) : state.h;
  state.lift +=
    (Math.max(0, hT - 0.18) * geometry.cowH - state.lift) *
    (1 - Math.exp(-dt * 6));
  state.zoomOut +=
    (clamp((hT - 0.35) / 0.8, 0, 1) * 0.09 - state.zoomOut) *
    (1 - Math.exp(-dt * 3));
  const mul = reduce ? 0.15 : 1;
  const amp =
    mul *
    (0.0018 * state.spdN + 0.0016 * state.boost + state.shake * 0.011) *
    geometry.cowH;
  const t = state.t;
  const sx =
    amp *
    (Math.sin(t * 21.3) * 0.45 +
      Math.sin(t * 34.7 + 1.3) * 0.25 +
      nA(t * 9) * 0.5);
  const sy =
    amp *
      (Math.sin(t * 27.1 + 0.7) * 0.45 +
        Math.sin(t * 41.9 + 2.1) * 0.25 +
        nB(t * 9) * 0.5) +
    0.004 * geometry.cowH * Math.sin(t * 0.9) * mul;
  const rot = mul * (0.0011 * state.spdN + state.shake * 0.004) * nC(t * 3.1);
  const zoom =
    1.035 +
    0.04 * smooth(state.boost) +
    0.012 * state.shake * mul -
    state.zoomOut;
  CAM = new DOMMatrix()
    .translate(W / 2, H / 2)
    .rotate(rot * DEG)
    .scale(zoom)
    .translate(-W / 2 + sx, -H / 2 + sy + state.lift);
}

// ---- game/effects.js
/**
 * @param {boolean} init полоса по всему экрану (true) или справа за краем
 * @returns {import('./types').SpeedLine}
 */
function newLine(init) {
  const front = Math.random() < 0.3;
  const edge = Math.random() < 0.5;
  const yN = front
    ? edge
      ? rand(0.02, 0.2)
      : rand(0.88, 0.99)
    : Math.random() < 0.6
      ? edge
        ? rand(0.02, 0.4)
        : rand(0.6, 0.99)
      : rand(0, 1);
  return {
    x: init ? rand(-0.2, 1.3) : rand(1.02, 1.5),
    yN,
    len: rand(0.12, 0.5),
    th: rand(0.8, 2.2),
    a: rand(0.03, 0.12),
    sp: rand(1.3, 2.8),
    front,
  };
}

// ---------------------------------------------------------------- particles, popups
// Фабрики частиц — единая форма Particle (карта, этап 5, S2).
// Порядок rand() в литералах — часть детерминизма, не переставлять.
/**
 * @param {number} x
 * @param {number} y
 * @param {number} z глубина точки спавна
 * @param {number} strength сила разлёта
 * @param {CanvasImageSource} [img]
 * @returns {import('./types').Particle}
 */
function createDust(x, y, z, strength, img) {
  const V = state.speed * geometry.cowH;
  return {
    kind: 'dust',
    img: img || dustImg,
    x: x + rand(-6, 6) * geometry.u,
    y: y - rand(0, 8) * geometry.u,
    z,
    vx: (-rand(0.05, 0.35) * V) / z,
    vy: -rand(0.04, 0.26) * geometry.cowH * strength,
    life: 0,
    max: rand(0.45, 1.1),
    r0: (rand(3, 8) * geometry.u) / z,
    r1: ((rand(24, 60) * geometry.u) / z) * (0.5 + strength * 0.5),
    a: rand(0.1, 0.24) * Math.min(1.4, 0.6 + strength * 0.4),
  };
}
/**
 * @param {number} x
 * @param {number} y
 * @param {number} z
 * @returns {import('./types').Particle}
 */
function createSpark(x, y, z) {
  const V = state.speed * geometry.cowH;
  return {
    kind: 'spark',
    img: null,
    x,
    y: y - 2 * geometry.u,
    z,
    vx: (-rand(0.2, 0.9) * V) / z + rand(-80, 80) * geometry.u,
    vy: -rand(0.25, 1.5) * geometry.cowH,
    life: 0,
    max: rand(0.18, 0.45),
    r0: 0,
    r1: 0,
    a: 0,
  };
}
/**
 * @param {number} x
 * @param {number} y
 * @returns {import('./types').Particle}
 */
function createRing(x, y) {
  return {
    kind: 'ring',
    img: null,
    x,
    y,
    z: 1,
    vx: 0,
    vy: 0,
    life: 0,
    max: 0.45,
    r0: 0,
    r1: 0,
    a: 0,
  };
}
/**
 * @param {number} x
 * @param {number} y
 * @param {number} z глубина точки спавна
 * @param {number} n число частиц
 * @param {number} strength сила разлёта
 * @param {CanvasImageSource} [img]
 */
function puff(x, y, z, n, strength, img) {
  if (reduce) n = Math.ceil(n * 0.4);
  for (let i = 0; i < n; i++) parts.push(createDust(x, y, z, strength, img));
}
/**
 * @param {number} x
 * @param {number} y
 * @param {number} z
 * @param {number} n
 */
function sparks(x, y, z, n) {
  if (reduce) return;
  for (let i = 0; i < n; i++) parts.push(createSpark(x, y, z));
}
/**
 * @param {number} x
 * @param {number} y
 */
function ring(x, y) {
  parts.push(createRing(x, y));
}
/**
 * @param {string} text
 * @param {import('./types').PopKind} kind
 */
function popup(text, kind) {
  if (!geometry.cowH) return;
  const m = poseMatrix({ y: state.bob - state.h, tilt: 0, sq: 1 });
  const nose = CAM.transformPoint(m.transformPoint(new DOMPoint(580, 120)));
  const head = CAM.transformPoint(m.transformPoint(new DOMPoint(400, 40)));
  const right = W - nose.x > 0.5 * geometry.cowH; // справа от морды есть место — пишем там, иначе над головой
  const used = new Set(pops.map((q) => q.slot));
  let slot = 0;
  while (used.has(slot)) slot++;
  pops.push({
    text,
    kind,
    slot,
    right,
    t: 0,
    durationS: kind === 'pts' ? 1.35 : 1.05,
    x: right
      ? Math.min(nose.x + 0.36 * geometry.cowH, W - 0.3 * geometry.cowH)
      : clamp(head.x, W * 0.3, W * 0.7),
    y: right ? head.y + 0.05 * geometry.cowH : head.y - 0.12 * geometry.cowH,
  });
}

// ---------------------------------------------------------------- update-шаги
/** Пыль из-под колёс на ровном ходу. @param {number} dt */
function stepDust(dt) {
  if (!onFlat()) return;
  const rate = 16 * state.spdN;
  const w = wheelsScreen();
  for (let i = 0; i < 2; i++)
    if (Math.random() < rate * dt)
      puff(w[i].x, w[i].y, w[i].z, 1, 0.55 + 0.4 * state.boost);
}
/** Частицы и всплывающие подписи. @param {number} dt */
function stepParticles(dt) {
  const V = state.speed * geometry.cowH;
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.life += dt;
    if (p.life >= p.max) {
      parts.splice(i, 1);
      continue;
    }
    if (p.kind === 'dust') {
      p.vx += (-V / p.z - p.vx) * (1 - Math.exp(-dt * 2.4));
      p.vy += (0.03 * geometry.cowH - p.vy) * (1 - Math.exp(-dt * 2));
    } else if (p.kind === 'spark') {
      p.vy += 6.5 * geometry.cowH * dt;
    } else {
      p.vx = -V * 0.35;
    }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
  if (parts.length > 460) parts.splice(0, parts.length - 460);
  for (let i = pops.length - 1; i >= 0; i--) {
    pops[i].t += dt;
    if (pops[i].t >= pops[i].durationS) pops.splice(i, 1);
  }
}
/** Линии скорости. @param {number} dt */
function stepLines(dt) {
  const V = state.speed * geometry.cowH;
  const nLines = reduce ? 10 : 26;
  while (lines.length < nLines) lines.push(newLine(true));
  for (const l of lines) {
    l.x -= (V * l.sp * (0.55 + 0.9 * state.boost) * dt) / W;
    if (l.x + l.len < -0.05) Object.assign(l, newLine(false));
  }
}
/** Облака: параллакс плюс собственный дрейф. @param {number} dt */
function stepClouds(dt) {
  for (const c of clouds) {
    const w = c.img.width * c.scale * geometry.u * 1.05;
    c.x -=
      ((c.drift + c.par * state.speed) * geometry.cowH * dt) /
      (W * 1.24 + w + c.gap * W);
  }
}

function drawCracks() {
  const V = state.speed * geometry.cowH,
    zE = geometry.zEdge * 0.99,
    zB = geometry.zBottom;
  const yE = yAt(zE),
    yB = yAt(zB);
  const cw = 0.016 * geometry.cowH,
    blur = V / 150;
  ctx.fillStyle = '#06070c';
  ctx.globalAlpha = (0.5 * cw) / (cw + blur);
  for (const c of cracks) {
    const xe = xAt(c.X, zE),
      xb = xAt(c.X, zB);
    if (Math.max(xe, xb) < -W * 0.2 || Math.min(xe, xb) > W * 1.2) continue;
    const we = (cw + blur) / zE,
      wb = (cw + blur) / zB;
    ctx.beginPath();
    ctx.moveTo(xe - we / 2, yE);
    ctx.lineTo(xe + we / 2, yE);
    ctx.lineTo(xb + wb / 2, yB);
    ctx.lineTo(xb - wb / 2, yB);
    ctx.closePath();
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/** @param {boolean} front передний (true) или задний план */
function drawLines(front) {
  ctx.globalCompositeOperation = 'screen';
  const k =
    (reduce ? 0.4 : 1) * (0.45 + 1.3 * state.boost) * (0.8 + 0.2 * state.spdN);
  for (const l of lines) {
    if (l.front !== front) continue;
    ctx.globalAlpha = clamp(l.a * k, 0, 0.5);
    ctx.drawImage(lineImg, l.x * W, l.yN * H, l.len * W, l.th * DPR * 2);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawParticles() {
  for (const p of parts) {
    const t = p.life / p.max;
    if (p.kind === 'dust') {
      if (!p.img) continue;
      const r = lerp(p.r0, p.r1, Math.sqrt(t));
      const stretch = Math.abs(p.vx) * 0.02;
      ctx.globalAlpha = p.a * (1 - t) ** 1.4;
      ctx.drawImage(
        p.img,
        p.x - r - stretch * 0.3,
        p.y - r,
        r * 2 + stretch,
        r * 2,
      );
    } else if (p.kind === 'ring') {
      const rx = geometry.cowH * 0.34 * (0.35 + 1.3 * t);
      ctx.globalAlpha = 0.85 * (1 - t);
      ctx.strokeStyle = '#f4f8ff';
      ctx.lineWidth = Math.max(1.5, 4 * geometry.u * (1 - t));
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, rx, rx * 0.26, 0, 0, TAU);
      ctx.stroke();
    }
  }
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const p of parts) {
    if (p.kind !== 'spark') continue;
    const t = p.life / p.max;
    ctx.globalAlpha = 1 - t;
    ctx.strokeStyle = t < 0.4 ? '#fff4d6' : '#ffb14e';
    ctx.lineWidth = Math.max(1, 1.6 * geometry.u);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - p.vx * 0.022, p.y - p.vy * 0.022);
    ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------- подписки
// Реакции на события модели (композиция — в main.js). Порядок регистрации
// задаёт порядок исполнения: эффекты идут первыми, как раньше шли
// прямые вызовы из player.js.
function initEffects() {
  on('airborne', (d) => {
    const w = wheelsScreen();
    if (d.from === 'jump') {
      puff(w[0].x, w[0].y, w[0].z, 10, 1.3);
      puff(w[1].x, w[1].y, w[1].z, 6, 1.0);
    } else if (d.from === 'double') {
      const x = (w[0].x + w[1].x) / 2,
        y = (w[0].y + w[1].y) / 2;
      ring(x, y + 0.03 * geometry.cowH);
      puff(x, y, 1, 8, 0.8);
    } else {
      puff(w[1].x, w[1].y, 1, 8, 1.1, woodImg);
    }
  });
  on('trick', (d) => {
    popup(d.kind === 'double' ? 'ДВОЙНОЙ' : TRICKS[d.kind].name, 'trick');
  });
  on('land', (d) => {
    if (onFeature() || d.impact <= 0) return;
    const w = wheelsScreen(),
      k = clamp(d.impact / 2.4, 0.6, 1.8);
    for (const p of w) {
      puff(p.x, p.y, p.z, Math.round(14 * k), 1.5 * k);
      sparks(p.x, p.y, p.z, Math.round(6 * k));
    }
  });
  on('crash', (d) => {
    popup(pick(['БАМ!', 'ОЙ!', 'МУУУ!']), 'crash');
    for (const p of d.wheels) {
      puff(p.x, p.y, p.z, 16, 1.8);
      sparks(p.x, p.y, p.z, 8);
    }
  });
  on('score', (d) => {
    popup(d.mult > 1 ? `+${d.points}  ×${d.mult}` : `+${d.points}`, 'pts');
  });
  on('ride-exit', (d) => {
    if (d.result === 'fail') return; // срыв — попап покажет crash
    popup(d.ok ? 'ПЕТЛЯ!' : 'НЕ ДОТЯНУЛ!', d.ok ? 'trick' : 'pts');
  });
}

function drawPops() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  const lh = 0.12 * geometry.cowH,
    top = H * 0.13 + lh * 0.5;
  for (const q of pops) {
    const k = q.t / q.durationS,
      a = k < 0.7 ? 1 : 1 - (k - 0.7) / 0.3;
    const sc = q.t < 0.2 ? Math.max(0.01, easeOutBack(q.t / 0.2)) : 1;
    const size =
      (q.kind === 'crash' ? 0.13 : q.kind === 'pts' ? 0.075 : 0.092) *
      geometry.cowH;
    const y = q.right
      ? clamp(q.y, top, H * 0.45) + q.slot * lh
      : Math.max(top + q.slot * lh, q.y - q.slot * lh);
    // текст — кэшированный спрайт: strokeText каждый кадр слишком дорогой
    const spr = textSprite(
      q.text,
      size,
      q.kind === 'crash' ? '#ff5a4a' : q.kind === 'pts' ? '#ffd84a' : '#ffffff',
      'rgba(8,10,22,0.8)',
      size * 0.17,
    );
    ctx.save();
    ctx.translate(q.x, y - k * 0.06 * geometry.cowH);
    ctx.scale(sc, sc);
    ctx.rotate(q.kind === 'crash' ? -0.09 : -0.04);
    ctx.globalAlpha = a;
    ctx.drawImage(spr, -spr.width / 2, -spr.height / 2);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// ---- game/player.js
// ---------------------------------------------------------------- jumps & tricks
const ready = () => !!imgs && !!geometry.cowH;
/** @returns {number} секунды до касания земли при текущей вертикальной скорости */
function timeToLand() {
  return (
    (state.hV +
      Math.sqrt(Math.max(0, state.hV * state.hV + 2 * GRAV * state.h))) /
    GRAV
  );
}

// Переходы автомата режимов (карта, этап 4, D5): state.mode меняется только
// здесь, каждый переход публикует своё событие на шине.

/** @param {'jump' | 'launch'} from чем вызван взлёт */
function enterAir(from) {
  state.mode = 'air';
  emit('airborne', { from });
}
/**
 * @param {number} g высота поверхности под доской (росты коровы)
 * @param {number} impact скорость касания; 0 — возврат после крэша
 */
function enterGround(g, impact) {
  state.mode = 'ground';
  state.h = g;
  state.isOnRamp = g > 0.001;
  emit('land', { impact });
}
/**
