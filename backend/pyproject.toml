[project]
name = "cowskate-backend"
version = "0.1.0"
description = "NoCowsAllowed — Cow Skate: Telegram HTML5 game backend"
requires-python = ">=3.14,<4.0"
dependencies = [
    "aiogram==3.30.0",
    "alembic>=1.17.2,<2.0.0",
    "fastapi>=0.141.1,<1.0.0",
    "psycopg[binary]>=3.3.4,<4.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "sqlmodel>=0.0.39,<1.0.0",
    "uvicorn[standard]>=0.52.0,<1.0.0",
]

[dependency-groups]
dev = [
    "httpx2==2.12.0",
    "pytest>=9.0.2,<10.0.0",
    "ruff>=0.14.14,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# `from app import models` — side-effect импорт ради регистрации таблиц
# на SQLModel.metadata.
"migrations/env.py" = ["F401"]
# conftest сперва выставляет os.environ-дефолты для Settings() (E402),
# `app.models` импортирован ради регистрации метаданных (F401).
"tests/conftest.py" = ["E402", "F401"]
