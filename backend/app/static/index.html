<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="Canvas-анимация: корова на скейтборде мчит по трассе — моушн-блюр, шлейф, пыль, искры и тряска камеры."
    />
    <title>Корова на скейте</title>
    <!-- telegram:begin -->
    <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
    <script src="https://telegram.org/js/games.js" defer></script>
    <script src="telegram-bridge.js" defer></script>
    <!-- telegram:end -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&display=swap"
    />
    <style>
      :root {
        --bg: #0b0e17;
        --ink: #eef2fb;
        --glass: rgba(10, 14, 26, 0.52);
        --line: rgba(255, 255, 255, 0.18);
        --gold: #ffd84a;
        color-scheme: dark;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        overflow: hidden;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        background: var(--bg);
        /* смена тона по зонам (фаза 2): ui.js ставит CSS-фильтр */
        transition: filter 0.9s ease;
      }
      /* Пост-эффекты DOM-слоями: блум/виньетку/зерно смешивает композитор,
     и canvas не тратит fullscreen-проходы с дорогими blend-режимами */
      #bloom,
      .vig,
      .grain {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #bloom {
        width: 100%;
        height: 100%;
        mix-blend-mode: screen;
        opacity: 0.42;
      }
      .vig {
        background:
          radial-gradient(
            circle 55vmax at 0 0,
            rgba(255, 246, 225, 0.1),
            rgba(255, 246, 225, 0) 70%
          ),
          linear-gradient(
            to bottom right,
            rgba(2, 3, 8, 0) 40%,
            rgba(2, 3, 8, 0.5) 100%
          ),
          radial-gradient(
            circle 62vmax at 47% 45%,
            rgba(0, 0, 0, 0) 28%,
            rgba(6, 8, 20, 0.26) 57%,
            rgba(3, 4, 12, 0.72) 100%
          );
      }
      .grain {
        inset: -170px;
        opacity: 0.075;
        mix-blend-mode: overlay;
        background-repeat: repeat;
        will-change: transform;
      }
      .ui {
        font-family: 'Unbounded', ui-rounded, 'Segoe UI', system-ui, sans-serif;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.55);
      }

      .hud {
        position: fixed;
        left: 16px;
        top: calc(14px + env(safe-area-inset-top, 0px));
        display: grid;
        gap: 4px;
        pointer-events: none;
        transition: opacity 0.6s ease;
      }
      .hud.dim {
        opacity: 0.55;
      }
      .score {
        font-weight: 800;
        font-size: 30px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
        transform-origin: left center;
        transition:
          transform 0.18s ease,
          color 0.18s ease;
      }
      .score.bump {
        transform: scale(1.14);
        color: var(--gold);
      }
      .best {
        font-weight: 500;
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0.78;
      }
      .best b {
        font-weight: 800;
        font-variant-numeric: tabular-nums;
      }
      .dist {
        font-weight: 500;
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-variant-numeric: tabular-nums;
        opacity: 0.78;
      }
      /* кошелёк клевера (фаза 3): всего собрано, живёт в localStorage */
      .clover {
        font-weight: 500;
        font-size: 10px;
        letter-spacing: 0.12em;
        font-variant-numeric: tabular-nums;
        opacity: 0.78;
      }
      .clover b {
        font-weight: 800;
      }
      /* жизни заезда — колокольчики гаснут по одной при крэше */
      .lives {
        display: inline-flex;
        gap: 4px;
        font-size: 14px;
        line-height: 1;
      }
      .lives[hidden] {
        display: none;
      }
      .lives i {
        font-style: normal;
        transition:
          opacity 0.3s ease,
          filter 0.3s ease;
      }
      .lives i.off {
        opacity: 0.18;
        filter: grayscale(1);
      }
      /* бейдж комбо-цепи: ×N, горшок и полоска окна; скрыт при n === 0 */
      .combo {
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 1px;
      }
      .combo[hidden] {
        display: none;
      }
      .combo b {
        font-weight: 800;
        font-size: 17px;
        line-height: 1;
        color: var(--gold);
        font-variant-numeric: tabular-nums;
        transform-origin: left center;
      }
      .combo .pot {
        font-weight: 700;
        font-size: 11px;
        color: var(--gold);
        font-variant-numeric: tabular-nums;
      }
      .combo .bar {
        width: 56px;
        height: 4px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.16);
        overflow: hidden;
      }
      .combo .bar i {
        display: block;
        width: 100%;
        height: 100%;
        background: var(--gold);
        transform-origin: left;
      }
      /* жёлтый → оранжевый → красный на ×6+ */
      .combo.hot b,
      .combo.hot .pot {
        color: #ff8a3d;
      }
      .combo.hot .bar i {
        background: #ff8a3d;
      }
      .combo.max b,
      .combo.max .pot {
        color: #ff5a4a;
      }
      .combo.max .bar i {
        background: #ff5a4a;
      }
      .combo.bump b {
        animation: comboPulse 0.22s ease;
      }
      @keyframes comboPulse {
        40% {
          transform: scale(1.3);
        }
      }

      .auto {
        position: fixed;
        right: 16px;
        top: calc(16px + env(safe-area-inset-top, 0px));
        padding: 7px 11px 7px 24px;
        border-radius: 999px;
        background: var(--glass);
        border: 1px solid var(--line);
        font-weight: 700;
        font-size: 10px;
        line-height: 1;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        pointer-events: none;
        text-shadow: none;
      }
      .auto::before {
        content: '';
        position: absolute;
        left: 10px;
        top: 50%;
        width: 7px;
        height: 7px;
        margin-top: -3.5px;
        border-radius: 50%;
        background: #7dffa1;
        box-shadow: 0 0 8px #7dffa1;
        animation: blink 1.4s ease-in-out infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.3;
        }
      }

      .hint {
        position: fixed;
        left: 16px;
        right: 16px;
        margin: 0;
        text-align: center;
        pointer-events: none;
        bottom: calc(78px + env(safe-area-inset-bottom, 0px));
        font-weight: 500;
        font-size: 10px;
        line-height: 1.6;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0.85;
        transition: opacity 1.8s ease;
      }
      .hint.dim {
        opacity: 0;
      }

      /* большой призыв «тапни» поверх демо-режима и контекстный тренер */
      .cta,
      .coach,
      .result {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        display: grid;
        justify-items: center;
        gap: 7px;
        text-align: center;
        pointer-events: none;
        transition: opacity 0.45s ease;
        /* свой слой заранее — появление не ждёт промоушна на занятом кадре */
        will-change: opacity;
      }
      .cta {
        top: 30%;
      }
      .cta b {
        font-weight: 800;
        font-size: 24px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--gold);
      }
      /* пульс крутится только у видимых надписей — скрытая анимация
         всё равно держит композитор */
      .cta:not(.dim) b {
        animation: ctaPulse 1.15s ease-in-out infinite;
      }
      .cta span,
      .result span {
        font-weight: 500;
        font-size: 10px;
        line-height: 1.6;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0.82;
      }
      @keyframes ctaPulse {
        50% {
          transform: scale(1.08);
        }
      }
      .coach {
        bottom: calc(150px + env(safe-area-inset-bottom, 0px));
        padding: 9px 16px;
        border-radius: 999px;
        white-space: nowrap;
        background: rgba(255, 216, 74, 0.14);
        border: 1px solid rgba(255, 216, 74, 0.55);
        color: var(--gold);
        font-weight: 800;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      /* выехать → стоять → раствориться (гашение — opacity-переход .dim).
         В keyframe обязан остаться translateX(-50%): анимация transform
         заменяет базовый transform — без него текст прыгал влево-вправо. */
      .coach:not(.dim) {
        animation: coachIn 0.3s ease-out;
      }
      @keyframes coachIn {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(10px);
        }
      }
      .result {
        top: 26%;
      }
      .result b {
        font-weight: 800;
        font-size: 21px;
        letter-spacing: 0.04em;
      }
      .result .newBest {
        color: var(--gold);
        font-weight: 800;
      }
      /* баннер рубежа зоны — «ЗОНА N» по центру на ~1.2 с (фаза 2) */
      .zone {
        position: fixed;
        left: 50%;
        top: 17%;
        transform: translateX(-50%);
        font-weight: 800;
        font-size: 30px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--gold);
        pointer-events: none;
        transition: opacity 0.3s ease;
        will-change: opacity;
      }
      .zone:not(.dim) {
        animation: zoneIn 0.34s ease-out;
      }
      @keyframes zoneIn {
        from {
          opacity: 0;
          transform: translateX(-50%) scale(1.35);
        }
      }
      .cta.dim,
      .coach.dim,
      .result.dim,
      .zone.dim {
        opacity: 0;
      }

      /* карточка туториал-гейта: игра на паузе, читаем спокойно */
      .tutor {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: grid;
        place-items: center;
        padding: 24px;
        margin: 0;
        background: rgba(5, 8, 15, 0.62);
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.18s ease,
          visibility 0s linear 0.18s;
      }
      .tutor.on {
        opacity: 1;
        visibility: visible;
        transition: opacity 0.18s ease;
      }
      .tutorCard {
        box-sizing: border-box;
        width: min(360px, 100%);
        padding: 20px 18px 16px;
        border-radius: 18px;
        background: rgba(10, 14, 26, 0.94);
        border: 1px solid var(--line);
        display: grid;
        gap: 12px;
        justify-items: center;
        text-align: center;
        transform: translateY(8px) scale(0.97);
        transition: transform 0.18s ease;
      }
      .tutor.on .tutorCard {
        transform: none;
      }
      .tutorCard b {
        font-weight: 800;
        font-size: 15px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--gold);
      }
      .tutorCard p {
        margin: 0;
        font-weight: 500;
        font-size: 12px;
        line-height: 1.65;
        letter-spacing: 0.04em;
        opacity: 0.92;
      }
      .tutorBtns {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        margin-top: 4px;
      }
      .tutorBtns button {
        appearance: none;
        -webkit-appearance: none;
        margin: 0;
        cursor: pointer;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        border-radius: 999px;
        border: 1px solid var(--line);
        padding: 11px 18px;
        color: var(--ink);
        background: rgba(24, 32, 56, 0.78);
        font:
          700 12px/1 'Unbounded',
          ui-rounded,
          'Segoe UI',
          system-ui,
          sans-serif;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        transition:
          transform 0.12s ease,
          background 0.12s ease,
          border-color 0.12s ease;
      }
      .tutorBtns button:active {
        transform: scale(0.95);
      }
      .tutorBtns button:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }
      #tutorOk {
        background: rgba(255, 216, 74, 0.22);
        border-color: rgba(255, 216, 74, 0.6);
        color: var(--gold);
      }
      #tutorSkip {
        opacity: 0.72;
        font-size: 10px;
      }

      .pad {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        display: flex;
        gap: 8px;
      }
      .pad button {
        appearance: none;
        -webkit-appearance: none;
        margin: 0;
        cursor: pointer;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        display: grid;
        justify-items: center;
        gap: 5px;
        min-width: 88px;
        padding: 10px 14px 8px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: var(--glass);
        color: var(--ink);
        font:
          700 12px/1.1 'Unbounded',
          ui-rounded,
          'Segoe UI',
          system-ui,
          sans-serif;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition:
          transform 0.12s ease,
          background 0.12s ease,
          border-color 0.12s ease;
      }
      .pad button:hover {
        background: rgba(24, 32, 56, 0.62);
      }
      .pad button.on {
        transform: scale(0.94);
        background: rgba(255, 216, 74, 0.3);
        border-color: rgba(255, 216, 74, 0.7);
      }
      .pad button:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }
      .pad kbd {
        font-family: inherit;
        font-weight: 500;
        font-size: 9px;
        line-height: 1;
        letter-spacing: 0.1em;
        opacity: 0.55;
      }
      @media (pointer: coarse) {
        .pad kbd {
          display: none;
        }
        /* на тачах backdrop-filter пересчитывается каждый кадр поверх живого canvas — дорого */
        .pad button {
          backdrop-filter: none;
          -webkit-backdrop-filter: none;
          background: rgba(10, 14, 26, 0.78);
        }
      }
      @media (max-width: 520px) {
        .pad {
          left: 16px;
          right: 16px;
          transform: none;
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 6px;
        }
        .pad button {
          min-width: 0;
          padding: 13px 2px;
          font-size: 11px;
        }
        .hint {
          bottom: calc(70px + env(safe-area-inset-bottom, 0px));
        }
        .cta {
          top: 24%;
        }
        .cta b {
          font-size: 20px;
        }
        .coach {
          bottom: calc(140px + env(safe-area-inset-bottom, 0px));
          font-size: 12px;
        }
        .score {
          font-size: 26px;
        }
      }
      /* временный блок турбо: кнопка «ГАЗ» + шкала запаса, только у
         boost-конструкций (петля) — ui.js гоняет класс .dim */
      .boost {
        position: fixed;
        left: calc(18px + env(safe-area-inset-left, 0px));
        bottom: calc(96px + env(safe-area-inset-bottom, 0px));
        display: grid;
        justify-items: center;
        gap: 8px;
        transition: opacity 0.25s ease;
        z-index: 6;
      }
      .boost.dim {
        opacity: 0;
        pointer-events: none;
      }
      .boost .turbo {
        width: 10px;
        height: 66px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--glass);
        display: flex;
        align-items: flex-end;
        overflow: hidden;
      }
      .boost .turbo i {
        display: block;
        width: 100%;
        height: 0;
        background: linear-gradient(180deg, var(--gold), #ff7a2a);
        transition: height 0.08s linear;
      }
      .boost button {
        appearance: none;
        -webkit-appearance: none;
        margin: 0;
        cursor: pointer;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        width: 84px;
        height: 84px;
        border-radius: 50%;
        border: 2px solid rgba(255, 154, 60, 0.75);
        background: radial-gradient(
          circle at 50% 32%,
          rgba(255, 122, 42, 0.95),
          rgba(158, 44, 10, 0.95)
        );
        color: #fff;
        font:
          800 17px/1 'Unbounded',
          ui-rounded,
          sans-serif;
        letter-spacing: 0.07em;
        text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
        box-shadow: 0 6px 26px rgba(255, 110, 30, 0.35);
        transition:
          transform 0.08s ease,
          box-shadow 0.08s ease;
      }
      .boost button:active,
      .boost button.on {
        transform: scale(0.92);
        box-shadow: 0 2px 12px rgba(255, 110, 30, 0.5);
      }
      .boost button:focus-visible {
        outline: 2px solid var(--gold);
        outline-offset: 2px;
      }
      @media (max-width: 520px) {
        .boost {
          bottom: calc(120px + env(safe-area-inset-bottom, 0px));
        }
        .boost button {
          width: 74px;
          height: 74px;
          font-size: 15px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .auto::before {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas
      id="scene"
      role="img"
      aria-label="Корова на скейтборде несётся по трассе, прыгает через препятствия и делает трюки"
    ></canvas>
    <canvas id="bloom" aria-hidden="true"></canvas>
    <div class="vig" aria-hidden="true"></div>
    <div class="grain" aria-hidden="true"></div>

    <div class="hud ui" id="hud">
      <span class="score" id="score">0</span>
      <span class="lives" id="lives" hidden> <i>🔔</i><i>🔔</i><i>🔔</i> </span>
      <div class="combo" id="combo" hidden>
        <b id="comboMult">×1</b>
        <span class="pot" id="comboPot">+0</span>
        <span class="bar"><i id="comboTimer"></i></span>
      </div>
      <span class="dist" id="dist" hidden></span>
      <span class="clover" id="clover">🍀 <b id="cloverTotal">0</b></span>
      <span class="best">рекорд <b id="best">0</b></span>
    </div>
    <div class="auto ui" id="auto">Демо</div>
    <p class="hint ui" id="hint">
      Зажми мышь или → — разгон · ← — тормоз · двойной прыжок — второй раз в
      воздухе
    </p>
    <div class="cta ui dim" id="cta">
      <b id="ctaMain">Пробел — прыжок</b>
      <span>перепрыгивай препятствия · трюки дают очки</span>
    </div>
    <div class="coach ui dim" id="coach"></div>
    <div class="result ui dim" id="result"></div>
    <div class="zone ui dim" id="zone"></div>
    <div class="boost ui dim" id="boost">
      <div class="turbo"><i id="turboBar"></i></div>
      <button type="button" id="gas" aria-label="Газ — жми часто для турбо">
        ГАЗ
      </button>
    </div>
    <div class="tutor ui" id="tutor" role="dialog" aria-modal="true">
      <div class="tutorCard">
        <b id="tutorTitle"></b>
        <p id="tutorText"></p>
        <div class="tutorBtns">
          <button type="button" id="tutorOk">Понял</button>
          <button type="button" id="tutorSkip">Пропустить всё</button>
        </div>
      </div>
    </div>
    <nav class="pad" aria-label="Трюки">
      <button type="button" data-act="jump">Прыжок<kbd>Пробел</kbd></button>
      <button type="button" data-act="spin">360<kbd>Q</kbd></button>
      <button type="button" data-act="flip">Сальто<kbd>E</kbd></button>
      <button type="button" data-act="kick">Кикфлип<kbd>R</kbd></button>
    </nav>

    <script type="module" src="game/main.js"></script>
  </body>
</html>
